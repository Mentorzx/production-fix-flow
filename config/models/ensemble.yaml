base_models: []

meta_learner:
  type: calibrator
  params:
    method: isotonic

training:
  cv_folds: 1
  verbose: 1
  stratified: true
  shuffle: true
  random_state: 42

balancing:
  enabled: false
  max_symbolic_ratio: 0.70
  min_hybrid_ratio: 0.30
  min_symbolic_rules: 10
  warn_threshold: 0.60

evaluation:
  primary_metric: mrr
  track_metrics:
  - mrr
  - hits@1
  - hits@10
  threshold_tuning:
    enabled: false

architecture:
  migration_mode: full_joint       # only joint DSLFM+PC supported
  calibration_only: true           # calibrador isotônico sobre scores DSLFM
  dslfm_enabled: true
  pc_enabled: true
  gating_enabled: false
  gating_high_confidence: 0.75
  gating_low_confidence: 0.40
  gating_max_symbolic_boost: 0.20
  gating_max_neural_boost: 0.20
