architecture:
  type: hierarchical  # "flat" (default, backward compatible) or "hierarchical"
  description: "flat=FeatureUnion+XGBoost, hierarchical=modality separation"

decision_router:
  thresholds:
    symbolic_confidence: 0.80
    neural_confidence: 0.55
  blend_weights:
    symbolic: 0.6
    neural: 0.4
  symbolic_low_threshold: 0.30

aggregators:
  symbolic:
    strategy: pc
    params:
      base_confidence: 0.01
      max_rules: 1500
      min_confidence: 0.30

  neural:
    strategy: weighted_average
    params:
      normalize_weights: true
    entropy_based_confidence: true

penalties:
  symbolic_dominance:
    enabled_in_flat: true
    enabled_in_hierarchical: false
    threshold: 0.95
    penalty_factor: 0.2

calibration:
  enabled: false
  method: isotonic  # isotonic or platt

logging:
  log_routing_decisions: false
  log_aggregation_details: false
