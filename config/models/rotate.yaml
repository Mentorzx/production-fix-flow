model:
  type: dslfm                  # dslfm mantém compatibilidade (lambda_logic=0.0)
  embedding_dim: 128           # ROTATE_LIBRARY_DEFAULTS (was 256)
  gamma: 12.0                   # mid-range paper (was 9.62)
  epsilon: 2.0
  lambda_logic: 0.0            # placeholder (DSLFM -> RotatE quando 0)
  double_entity_embedding: false
  double_relation_embedding: false

training:
  epochs: 30                    # ROTATE_LIBRARY_DEFAULTS (was 150)
  batch_size: 512               # power of 2 (OK)
  learning_rate: 0.00005
  weight_decay: 0.0007
  negative_samples: 128         # ROTATE_LIBRARY_DEFAULTS power of 2 (was 512)
  self_adversarial_negative_sampling: false  # ROTATE_LIBRARY_DEFAULTS (was true)
  adversarial_temperature: 1.0  # ROTATE_LIBRARY_DEFAULTS (was 0.50)
  optimizer: adam
  scheduler: warmup_linear
  warmup_steps: 1200
  gradient_clip_val: 1.0
  early_stopping_patience: 8
  seed: 42

data_splits:
  val_ratio: 0.15
  test_ratio: 0.15

evaluation:
  num_negatives: 50
  filtered_metrics: true
  top_k: 10

checkpointing:
  save_dir: "checkpoints/rotate"
  monitor_metric: "mrr"
  save_top_k: 1
  versioned: true
  save_every_n_epochs: 50

device:
  use_cuda: true
  cuda_device: 0
  mixed_precision: true

regularization:
  entity_regularizer_weight: 0.0001    # ROTATE_LIBRARY_DEFAULTS 1e-4 (was 1e-5)
  relation_regularizer_weight: 0.0001  # ROTATE_LIBRARY_DEFAULTS 1e-4 (was 1e-5)

contrastive:
  enabled: false
  loss_type: "kg_loss"
  temperature: 0.07
  margin: 1.0
  lambda_weight: 0.1

sota:
  label_smoothing: 0.1
  use_reciprocal_relations: true
  type_constraints:
    enabled: false
    type_file: null
  relation_aware_negatives: false

debug:
  log_losses: true
  validate_tensors: true
  validate_every_n_epochs: 5
  log_gradient_norm: true
  log_embedding_stats: true

hpo:
  embedding_dim:
    type: categorical
    choices: [128, 256, 512]
  gamma:
    type: float
    low: 6.0
    high: 24.0
  learning_rate:
    type: float
    low: 0.00001
    high: 0.0005
    log: true
  batch_size:
    type: categorical
    choices: [256, 512]
  negative_samples:
    type: int
    low: 256
    high: 1024
  adversarial_temperature:
    type: float
    low: 0.5
    high: 2.0

lightgbm:
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    # P1.1 - Stronger regularization to prevent overfitting
    num_leaves: 31              # Reduced from 31 for stronger regularization
    learning_rate: 0.05         # META_LIBRARY_DEFAULTS (was 0.0344)
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 30        # Increased from 5 to require more samples per leaf
    min_sum_hessian_in_leaf: 1e-3
    reg_alpha: 0.5              # L1 regularization
    reg_lambda: 2.0             # L2 regularization
    max_bin: 127                # Reduced from 255 default for less granular splits
    verbose: -1
    force_row_wise: true
  training:
    num_boost_round: 100        # META_LIBRARY_DEFAULTS (was 150)
    early_stopping_rounds: 10
    # P3: Use true validation split from valid_optimized.parquet instead of train_test_split
    # When true, validation metrics will be more comparable to final ensemble test metrics
    # Default false for backward compatibility
    use_true_validation_split: true
  negative_sampling:
    ratio: 2.12
