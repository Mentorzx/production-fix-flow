paths:
  data_dir: ./data                  # Directory where input data is stored
  output_dir: kg                    # Directory where output files will be saved (relative to OUTPUTS_DIR)
  graph_subdir: kg                  # Subdirectory for graph model files (under output_dir)

pipeline:
  top_k: 10                         # Number of top results to consider
  num_workers: 2                    # Number of worker threads
  chunk_size: 200                   # Size of data chunks for processing
  max_chunk_size: 300               # Maximum size of chunks in the ranking phase
  max_rules_per_chunk: 1000         # Maximum number of rules to process per chunk
  enable_caching: true              # Whether to enable caching for performance
  preprocess:
    enabled: true                   # Whether preprocessing is enabled
    use_centralized_preprocessing: true  # Use pff.domain.kg.preprocessing module (RECOMMENDED)
    homogeneity_level: 0.5          # Level of homogeneity for preprocessing
    min_support: 3                  # Minimum support threshold for preprocessing
    use_map_elements_homogenizer: true  # Vectorized map_elements homogenization
  calibration:
    enabled: true                   # Whether to enable score calibration
    method: "both"                  # Options: "platt", "isotonic", "both"
    cross_validation_folds: 5       # Number of folds for cross-validation
    optimize_threshold: true        # Whether to find the optimal threshold
    optimization_metric: "f1"       # Metric for optimization: "f1", "precision", "recall"

data_optimizer:
  min_entity_degree: 2              # Reduced for sparse graph (was 3)
  min_relation_support: 20          # Reduced to keep more relations (was 50)
  max_entities_to_keep: null
  balance_relations: true
  preserve_original: true
  log_statistics: true
  focus_on_active_users: true
  min_product_interactions: 1       # Reduced for sparse data (was 2)
  # Data quality preprocessing (critical for MRR improvement)
  remove_duplicates: true           # Remove duplicate triples
  remove_self_loops: true           # Remove self-loops (h == t)
  add_inverse_relations: true       # Add r_inv for each relation
  inverse_relation_suffix: "_inv"   # Suffix for inverse relations
  # Leakage detection and fix (SOTA)
  check_leakage: true               # Verify no triple overlap between splits
  fix_leakage: true                 # Auto-fix via SOTA re-split if leakage detected
  resplit_ratios: [0.8, 0.1, 0.1]   # Train/valid/test ratios for re-split
  ensure_transductive: true         # Ensure all valid/test entities in train
  stratified_by_relation: true      # Stratify split by relation

builder:
  source_path: "data/models/correct.parquet"  # Path to the source model file
  parallel: true                    # Whether to run builder in parallel mode
  disk_cache: false                 # Whether to use disk caching
  max_members: 300                  # Maximum number of members to process (null = process all)


rule_filter:
  enabled: false

dask:
  n_workers: 2                      # Number of Dask worker processes
  threads_per_worker: 1             # Number of threads per worker
  memory_limit: "1.5GB"             # Memory limit per worker (e.g., "4GB", "500MB")
  dashboard_address: ":8787"        # Address for the Dask diagnostics dashboard
  processes: true
  silence_logs: 30
  distributed:
    scheduler:
      work-stealing: false
      allowed-failures: 3
    worker:
      memory:
        target: 0.80
        spill: 0.85
        pause: 0.90
        terminate: 0.95

ray:
  num_cpus: 1                       # Number of CPUs for Ray
  object_store_memory_gb: 2.0       # Memory allocation for Ray object store in GB
  address:                          # Ray cluster address (null or auto for local cluster)
  runtime_env: {}                   # Execution environment for workers
  log_to_driver: false              # Whether to log to driver
  include_dashboard: false          # Whether to include dashboard
  logging_config:
    encoding: "TEXT"                # Encoding format for logs

optimizer:
  system_profile:
    enable_disk_benchmark: false
    disk_benchmark_size_mb: 32
    benchmark_dir: outputs/benchmarks
    ssd_threshold_mb_s: 120
  heuristics:
    min_chunk_size: 10000
    chunk_divisor: 10
    heap_fraction: 0.4

    ray_object_store_fraction: 0.3
    runtime_overhead_minutes: 5
    small_graph_threshold: 10000000
    small_graph_min_support: 3
    large_graph_min_support: 5
    snapshots:
      speed: [30, 60]
      quality: [60, 120, 300, 600]
      balanced: [30, 60, 120]
  importance:
    enable_importance_scoring: false
    importance_method: degree      # degree | pagerank | betweenness
    timeout_seconds: 60
    max_iterations: 100
