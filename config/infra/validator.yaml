confidence_threshold: 0.5
high_confidence_threshold: 0.8

model:
  path: "outputs/ensemble/stacking_model.pkl"
  feature_count: 100

feature_engineering:
  enabled: true
  max_features: 324
  embedding_dim: 64
  use_structural_features: true
  use_semantic_features: true

hybrid_model:
  rotate_weight: 0.6
  lightgbm_weight: 0.4
  fallback_threshold: 0.8

validation:
  min_confidence: 0.5
  max_invalid_triples: 0.8
  degraded_mode_threshold: 0.8
  max_recursion_depth: 20

paths:
  rotate_checkpoint: "checkpoints/rotate/best_model.pt"
  lightgbm_model: "outputs/rotate/lightgbm_model.bin"
  entity_mappings: "outputs/rotate/rotate_entity_map.parquet"
  relation_mappings: "outputs/rotate/rotate_relation_map.parquet"
  
detection:
  required_fields:
    - "id"
    - "customer_id" 
    - "contract"
  invalid_statuses:
  critical_missing_fields:
    - "contract.id"
    - "contract.product"
  
violation_scoring:
  rate_floor: 0.005              # Start penalizing at 0.5% violation rate
  penalty_multiplier: 12.0       # Stronger penalty for violations
  max_penalty: 0.45              # Allow up to 45% penalty
  no_violations_bonus: 0.35      # Bonus for no violations
  below_threshold_bonus: 0.15    # Bonus for below threshold
  confidence_anchor: 0.5         # Confidence anchor for penalty calc

xai:
  rotate_sample_size: 5          # Sample size for RotatE XAI scoring

cache:
  rules_ttl_days: 7              # TTL for aggregated rules cache
  triples_cache_subdir: "triples_cache"  # Subdirectory for triples cache

performance:
  ray_threshold_rules: 10000     # Rules count threshold to use Ray backend vs Process

scoring:
  rotate_scale: 0.8              # RotatE score scaling factor
  rotate_offset: 0.1             # RotatE score offset

messages:
  confidence_low: "Confiança insuficiente para validação automática"
  structure_invalid: "Estrutura de dados não conforme"
  required_field_missing: "Campo obrigatório ausente"
  invalid_status: "Status indica problema na linha"
  no_products: "Nenhum produto encontrado no contrato"
  no_contracts: "Nenhum contrato encontrado na resposta"