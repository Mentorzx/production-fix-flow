pool:
  min_size: 2
  max_size: 10
  command_timeout: 60          # seconds
  max_queries: 50000           # recycle connection after N statements
  max_inactive_connection_lifetime: 300  # seconds idle before recycle
  statement_timeout: 0         # optional server-side timeout (0 = disabled)

retry:
  attempts: 3
  backoff_seconds: 1.5

ssl:
  enabled: false
  sslmode: "verify-full"
  ca_file: null
  cert_file: null
  key_file: null

backup:
  dir: outputs/backups/postgres
  keep_last: 5
