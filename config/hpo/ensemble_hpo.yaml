# P3: Scoring function configuration (config-first penalty tuning)
scoring:
  # Coefficient for symbolic dominance penalty (default 0.50 for backward compatibility)
  # Higher values penalize symbolic dominance more strongly
  symbolic_dominance_penalty_coeff: 1.0
  # Fallback dominance target when target_symbolic_ratio is not in trial params
  fallback_dominance_target: 0.70
