hpo_bounds:
  weights:
    neural_weight:
      low: 0.35
      high: 0.55
    rules_weight:
      low: 0.10
      high: 0.22
    lightgbm_weight:
      low: 0.40
      high: 0.65
  thresholds:
    neural_threshold:
      low: 0.3
      high: 0.7
    rules_threshold:
      low: 0.3
      high: 0.7
    lightgbm_threshold:
      low: 0.3
      high: 0.7
  target_symbolic_ratio:
    low: 0.30
    high: 0.60
  feature_selection_threshold:
    low: 0.35
    high: 0.60
  # Hierarchical ensemble routing thresholds (only used when architecture.type = "hierarchical")
  hierarchical:
    symbolic_high_threshold:
      low: 0.60
      high: 0.85
    symbolic_low_threshold:
      low: 0.20
      high: 0.40
    neural_fallback_threshold:
      low: 0.40
      high: 0.70
    blend_weight_symbolic:
      low: 0.40
      high: 0.70
  kge:
    negative_ratio:
      low: 0.40
      high: 0.80
    embedding_dim:
      choices: [128, 256]
    self_adversarial:
      choices: [false, true]
    batch_size:
      low: 256
      high: 640

metrics_bounds:
  kge:
    mrr:
      low: 0.15
      high: 0.75
    hits_at_3:
      low: 0.20
      high: 0.90
    mean_rank:
      low: 5
      high: 500
      invert: true
  rules:
    confidence:
      low: 0.4
      high: 0.95
    recall:
      low: 0.05
      high: 0.5
    coverage:
      low: 0.05
      high: 0.5
    relation_coverage:
      low: 0.05
      high: 0.6
    rules_per_relation:
      low: 1
      high: 80
  learner:
    lgbm_auc:
      low: 0.6
      high: 0.99
    lgbm_pr_auc:
      low: 0.5
      high: 0.99
    lgbm_mcc:
      low: 0.0
      high: 0.9
    generalization_gap:
      low: 0.0
      high: 0.20
      invert: true
    lightgbm_ece:
      low: 0.0
      high: 0.10
      invert: true
    lightgbm_entropy:
      low: 0.0
      high: 0.70
      invert: true
    hybrid_f1:
      low: 0.45
      high: 0.9
    xgb_f1:
      low: 0.45
      high: 0.9
    xgb_test_auc:
      low: 0.6
      high: 0.99
    base_learner_agreement:
      low: 0.4
      high: 0.95
  ensemble:
    neural_symbolic_synergy:
      low: -0.20
      high: 0.20
    ensemble_ece:
      low: 0.0
      high: 0.10
      invert: true
    ensemble_entropy:
      low: 0.0
      high: 0.70
      invert: true

scoring:
  scoring_method: edas  # weighted_avg | edas
  symbolic_dominance_penalty_coeff: 0.75
  fallback_dominance_target: 0.70
  min_neural_contribution: 0.25
  symbolic_soft_threshold: 0.65
  symbolic_hard_threshold: 0.85
  learner_weights:
    auc: 0.30
    pr_auc: 0.25
    mcc: 0.15
    hybrid_f1: 0.15
    xgb_f1: 0.10
    agreement: 0.05
  generalization_gap_penalty_coeff: 0.15
  synergy_bonus_coeff: 0.10
  synergy_penalty_coeff: 0.03
  synergy_max_bonus: 0.08
  synergy_max_penalty: 0.02
  rules_per_relation_weight: 0.10
  calibration_penalty:
    lightgbm_ece_coeff: 0.10
    ensemble_ece_coeff: 0.10
    lightgbm_entropy_coeff: 0.05
    ensemble_entropy_coeff: 0.05

constraints:
  coverage_gate: 0.25
  dominance_gate: 0.85
  min_symbolic_activation: 0.01
  symbolic_max_rules: null

live_plots:
  enabled: true
  max_trials_axis: 50
  output_subdir: "optimization/plots/live"

mlflow:
  enabled: true
  tracking_uri: "outputs/optimization/mlruns"
  experiment_name: "pff_ensemble_hpo"

optuna:
  tpe:
    multivariate: true
    group: true
    n_startup_trials: 5   # Minimum random trials before TPE starts
    constant_liar: false  # Enable when running Optuna with n_jobs > 1
  hyperband:
    min_resource: 5
    max_resource: 80      # Alinha com rotate_epochs (60-80) para permitir early stopping
    reduction_factor: 3
