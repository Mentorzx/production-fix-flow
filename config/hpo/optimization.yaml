hpo_memory:
  enabled: true
  top_k_trials: 5
  warmstart_trials: 3
  storage_subdir: "hpo_replay"
  min_score_delta: 0.0

storage:
  backend: "postgres"
  url: null
  engine:
    pool_size: 20
    max_overflow: 10
    pool_pre_ping: true
    connect_args:
      keepalives: 1
  journal_path: null

parallel:
  n_jobs: 2
  use_journal_for_parallel: true
  optuna:
    gc_after_trial: true
  cv:
    disable_when_cuda: true
    disable_when_dataloader_workers: true
    disable_when_auto_workers: true

sampler:
  type: "tpe"
  n_startup_trials: 5
  n_ei_candidates: 24
  multivariate: true
  group: true
  constant_liar: true
  consider_prior: true
  consider_magic_clip: true
  seed: 42
  
  # Adaptive sampler switching: automatically alternates between TPE and GPSampler on stagnation
  adaptive_switching: true
  adaptive_window_size: 7
  adaptive_min_trials: 10
  adaptive_threshold: 0.02
  adaptive_max_switches: 3
  
  # Alternative samplers for diversity when stuck in local optima
  alternatives:
    cmaes:
      enabled: true
      seed: 42
      n_startup_trials: 5
      warn_independent_sampling: false

pruner:
  type: "hyperband"
  n_startup_trials: 5
  n_warmup_steps: 10
  interval_steps: 1
  patient:
    patience: 3
    min_delta: 0.0
  wilcoxon:
    p_threshold: 0.1
    n_startup_steps: 2
  hyperband:
    min_resource: 3
    max_resource: 100
    reduction_factor: 5
    burn_in_epochs: 5

defaults:
  n_trials: 50
  timeout_seconds: 7200
  direction: "maximize"
  enable_pruning: true
  cv_folds: 3
  cv_parallel: false
  cv_max_workers: 2
  inverse_relation_policy: "drop_suffix"  # Se voltar para keep neste dataset, o MRR tende a cair por redundancia de *_inv.
  inverse_suffix: "_inv"  # Deve bater com o sufixo do preprocess; mismatch deixa inversas passarem e derruba ranking.
  relation_id_policy: "preserve_sparse"  # Trocar para remap_dense neste dataset ja mostrou regressao de MRR.

search_space_advisor:
  min_trials_any: 5  # Menos que isso gera recomendacoes com pouca evidencia e tende a reduzir confiabilidade.
  min_trials_aggressive: 20  # Reduzir demais incentiva ajustes agressivos cedo e pode derrubar MRR/Hits@K.
  top_k_fraction: 0.25  # Faixa pequena demais superajusta no ruido; grande demais dilui sinal dos melhores trials.
  top_k_min: 3  # Abaixo de 3, concentracao estatistica fica instavel para decidir expandir/estreitar.
  conditional_scope_threshold: 0.90  # Diminuir muito mascara parametros condicionais e causa recomendacoes globais erradas.
  enable_surrogate: true  # Desligar reduz custo computacional, mas perde modelagem de nao linearidades no score.
  enable_interactions: true  # Desligar remove sinais de interacao entre parametros e pode degradar recomendacoes.
  disable_internal_importances: false  # Se true, depende apenas de importancias externas; pode reduzir robustez quando faltam importancias.
  adaptive_perf_enabled: true  # Quando ativo, reduz automaticamente modulos caros se latencia alta vier com confiabilidade estavel.
  adaptive_perf_ms_threshold: 1200.0  # Limiar de latencia (ms) para iniciar degradacao controlada de custo.
  adaptive_perf_validation_lb_min: 0.75  # So aplica degradacao se Wilson LB de validacao estiver acima deste minimo.
  adaptive_perf_cooldown_calls: 2  # Mantem degradacao por algumas chamadas para evitar oscilacao liga/desliga.
  rust_spearman_min_len: 512  # Reduzir demais pode piorar latencia por overhead de conversao; aumentar demais perde aceleracao em vetores medios.
  runtime_state_max_items: 1024  # Valor muito baixo pode descartar estado de confianca e gerar oscilacao nas recomendacoes.
  self_audit_period_trials: 10  # Periodo alto atrasa bloqueio de sinais ruins; baixo demais aumenta custo e ruido.
  self_audit_min_prefix: 8  # Menor que isso audita com pouco historico e aumenta falso positivo de vilao.
  self_audit_min_suffix: 5  # Sufixo muito curto reduz poder estatistico do teste direcional.
  self_audit_max_prefixes: 6  # Alto demais encarece auditoria; baixo demais perde cobertura temporal.
  self_audit_min_group_total: 8  # Menor valor bloqueia parametros cedo demais por amostra pequena.
  self_audit_wilson_block: 0.35  # Limiar mais alto bloqueia mais agressivamente e pode suprimir exploracao util.
  self_audit_min_match_points: 5  # Abaixo disso a correlacao de sufixo fica instavel e menos confiavel.
  categorical_min_topk_samples: 3  # Aumentar torna a reducao de categorias mais conservadora com poucos trials.
  categorical_min_topk_unique: 1  # Subir para 2+ evita reduzir quando top-k observa categoria unica.
  categorical_min_effective_categories: 1.0  # Valores >1.0 exigem mais diversidade efetiva antes de reduzir categorias.
  cache_ttl_seconds: 900  # TTL muito alto pode manter conselho stale; muito baixo aumenta recomputes sem ganho.
  cache_max_items: 128  # Valor baixo gera eviccao excessiva e piora latencia de consulta no dashboard.
  persistent_cache_enabled: true  # Desativar elimina L2 persistente e reduz continuidade apos reinicio.

synthetic_data:
  seed: 42
  n_entities: 64
  n_relations: 8
  train_size: 256
  valid_size: 64

callbacks:
  log_interval: 10
  enable_visualizer: false

multi_objective:
  enabled: false
  sampler: "motpe"
  directions: ["maximize", "maximize", "minimize"]
  secondary_metric: "mcc"
  tertiary_metric: "duration"
  population_size: 50
  mutation_prob: 0.1
  crossover_prob: 0.9

dslfm_kgc:
  training:
    lr_low: 1.0e-4
    lr_high: 2.0e-3
    weight_decay_low: 1.0e-6
    weight_decay_high: 1.0e-4
    batch_size_choices: [256, 512, 1024]
    negative_sample_size_low: 384
    negative_sample_size_high: 672
    grad_clip_low: 1.0
    grad_clip_high: 10.0
    warmup_ratio_low: 0.10
    warmup_ratio_high: 0.20
    epochs_low: 100
    epochs_high: 300
    use_compile: false
  architecture:
    feature_dim_choices: [128, 512]
    max_communities_choices: [64, 128]
    hidden_dim_choices: [256]
    kl_weight_low: 1.0e-4
    kl_weight_high: 1.0e-2
    sparsity_weight_low: 1.0e-6
    sparsity_weight_high: 1.0e-2
    ibp_alpha_low: 1.0
    ibp_alpha_high: 10.0
  contrastive:
    temperature_low: 0.02
    temperature_high: 0.08
    margin_low: 0.0
    margin_high: 0.05
    num_negatives_choices: [256, 384, 512]
    num_global_negatives_low: 32
    num_global_negatives_high: 96
    neg_sampler_choices: ["degree_based"]
    self_adversarial_choices: [true]
  sampling:
    adv_temperature_low: 1.13272
    adv_temperature_high: 1.13272
    hard_neg_ratio_low: 0.0
    hard_neg_ratio_high: 0.7
  pc:
    enabled_choices: [true]
    num_latents_choices: [16, 32, 64, 128]
    lambda_pc_low: 0.002
    lambda_pc_high: 0.05
    depth_choices: [4]
    pruning_threshold_low: 0.01
    pruning_threshold_high: 0.05
    rebuild_every_low: 0
    rebuild_every_high: 50
  logic:
    lambda_logic_low: 0.0
    lambda_logic_high: 0.05
    t_norm_choices: ["product", "lukasiewicz", "godel"]
  low_rank:
    enabled: true
    num_basis_choices: [2, 4, 8, 16]
  faiss:
    nlist_choices: [256, 512, 1024, 2048]
    nprobe_choices: [4, 8, 16, 32]
    eval_topk_choices: [512, 1024, 2048]
  defaults:
    use_bert: false
    lambda_sum_cap: 0.1
    use_checkpointing: true
    learnable_temperature: true
    validate_every: 2
    early_stopping_patience: 15

adaptive_range_factors:
  batch_size_min_divisor: 2
  batch_size_min_floor: 256
  num_neg_min_divisor: 2
  num_neg_min_floor: 64
  early_stopping_patience_low: 4

time_budget_pruning:
  enabled: false
  max_total_time_s: 1380
  tolerance_start_s: 1300
  tolerance_evals: 2
  train_time_window: 10
  eval_time_window: 3

binary_metrics:
  enabled: true
  num_negatives: 20
  max_samples: 5000
  batch_size: 2048
  device: auto
  cuda_free_ratio_min: 0.15

hpo_bounds:
  weights:
    neural_weight:
      low: 0.35
      high: 0.55
    rules_weight:
      low: 0.10
      high: 0.22
  thresholds:
    neural_threshold:
      low: 0.3
      high: 0.7
    rules_threshold:
      low: 0.3
      high: 0.7
  target_symbolic_ratio:
    low: 0.30
    high: 0.60
  feature_selection_threshold:
    low: 0.35
    high: 0.60
  hierarchical:
    symbolic_high_threshold:
      low: 0.60
      high: 0.85
    symbolic_low_threshold:
      low: 0.20
      high: 0.40
    neural_fallback_threshold:
      low: 0.40
      high: 0.70
    blend_weight_symbolic:
      low: 0.40
      high: 0.70
  kge:
    negative_ratio:
      low: 0.40
      high: 0.80
    embedding_dim:
      choices: [128, 512]
    self_adversarial:
      choices: [false]
    batch_size:
      low: 512
      high: 512

metrics_bounds:
  kge:
    mrr:
      low: 0.0
      high: 0.60
    hits_at_3:
      low: 0.0
      high: 0.50
    mean_rank:
      low: 5
      high: 500
      invert: true
  rules:
    confidence:
      low: 0.4
      high: 0.95
    recall:
      low: 0.05
      high: 0.5
    coverage:
      low: 0.05
      high: 0.5
    relation_coverage:
      low: 0.05
      high: 0.6
    rules_per_relation:
      low: 1
      high: 80
  learner:
    auc:
      low: 0.5
      high: 0.99
    pr_auc:
      low: 0.4
      high: 0.99
    mcc:
      low: -1.0
      high: 1.0
    ap10:
      low: 0.0
      high: 1.0
    precision:
      low: 0.3
      high: 0.95
    recall:
      low: 0.3
      high: 0.95
  ensemble:
    neural_symbolic_synergy:
      low: -0.20
      high: 0.20
    ensemble_ece:
      low: 0.0
      high: 0.10
      invert: true
    ensemble_entropy:
      low: 0.0
      high: 0.70
      invert: true

scoring:
  eps: 0.02
  scoring_method: edas
  weights:
    rank_block: 0.70
    clf_block: 0.25
    time_block: 0.15
  rank_metrics:
    mrr: 0.40
    best_mrr: 0.30
    hits1: 0.15
    hits3: 0.10
    hits10: 0.05
  clf_metrics:
    auc: 0.30
    pr_auc: 0.20
    mcc: 0.25
    ap10: 0.15
    precision: 0.07
    recall: 0.03
  time_metric_weight: 1.0
  time_scale:
    t_best: 400.0
    t_target: 800.0
    t_worst: 1200
    score_at_best: 0.88
    score_at_target: 0.55
    score_at_worst: 0.20
  symbolic_dominance_penalty_coeff: 0.75
  fallback_dominance_target: 0.70
  min_neural_contribution: 0.25
  symbolic_soft_threshold: 0.65
  symbolic_hard_threshold: 0.85
  learner_weights:
    auc: 0.40
    pr_auc: 0.30
    precision: 0.15
    recall: 0.15
  generalization_gap_penalty_coeff: 0.15
  synergy_bonus_coeff: 0.10
  synergy_penalty_coeff: 0.03
  synergy_max_bonus: 0.08
  synergy_max_penalty: 0.02
  rules_per_relation_weight: 0.10
  calibration_penalty:
    ensemble_ece_coeff: 0.10
    ensemble_entropy_coeff: 0.05

constraints:
  coverage_gate: 0.25
  dominance_gate: 0.85
  min_symbolic_activation: 0.01
  symbolic_max_rules: null

live_plots:
  enabled: true
  max_trials_axis: 50
  output_subdir: "optimization/plots"
  enable_optuna_dashboard: true
  dashboard_interval: 5
  dashboard_top_n: 12
  dashboard_data_path: "outputs/.cache/hpo/dashboard_data.json"
  dashboard_debug_mode: false

mlflow:
  enabled: true
  tracking_uri: "outputs/optimization/mlruns"
  experiment_name: "pff_ensemble_hpo"
