base_models:
- type: symbolic
  enabled: true
  params:
    min_confidence_threshold: 0.01  # 0.038
    aggregation_strategy: weighted_mean
    max_rules: 5000
    weight_boost: 1.5
- type: transe
  enabled: true
  params: {}
- type: hybrid
  enabled: true
  params: {}

meta_learner:
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.07157392643360624
    colsample_bytree: 0.4461967499093965
    colsample_bylevel: 0.6
    colsample_bynode: 0.8
    subsample: 0.9129316243641803
    reg_alpha: 0.08235604202937723
    reg_lambda: 2.844382201787838
    min_child_weight: 7
    gamma: 0.39056610258319013
    scale_pos_weight: 1.0
    tree_method: hist
    objective: binary:logistic
    eval_metric:
    - logloss
    - aucpr
    early_stopping_rounds: 15
    random_state: 42
    use_label_encoder: false
    n_jobs: -1
    importance_type: gain
    feature_importance_output: true

training:
  cv_folds: 5
  verbose: 1
  stratified: true
  shuffle: true
  random_state: 42

autofeeding:
  enabled: true
  confidence_threshold: 0.7
  min_rules: 100
  max_rules: 2000
  quality_filter: true

balancing:
  enabled: true
  strategy: auto
  target_ratio: 0.3
  fallback: class_weight

evaluation:
  primary_metric: f1
  track_metrics:
  - precision
  - recall
  - roc_auc
  - pr_auc
  threshold_tuning:
    enabled: true
    method: pr_optimal
    track_metric: pr_auc
