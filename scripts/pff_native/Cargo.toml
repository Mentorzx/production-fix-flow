[package]
name = "pff_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust extensions for PFF HPO acceleration"

[lib]
name = "pff_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rustc-hash = "2.0"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
