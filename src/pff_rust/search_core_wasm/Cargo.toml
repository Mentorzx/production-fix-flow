[package]
name = "search_core_wasm"
version = "0.1.0"
edition = "2021"
description = "Hybrid search core for PFF dashboard command palette"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boomphf = "0.6.0"
nucleo-matcher = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
