[package]
name = "pff-rust"
version = "0.1.0"
edition = "2024"
authors = ["PFF Team"]
description = "High-performance Rust kernels for PFF (BLAKE3, KGC, rule acceleration)"

[lib]
name = "_pff_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
numpy = "0.27.0"
blake3 = "1.5.0"
rayon = "1.10"
ahash = "0.8"
rand = "0.9"
rand_pcg = "0.9"
sonic-rs = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
