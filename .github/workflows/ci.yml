name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.3.3"
  PFF_IMAGE_BUDGET_DEFAULT_GB: "3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run Ruff
        run: poetry run ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pff_user
          POSTGRES_PASSWORD: ci-postgres-pass
          POSTGRES_DB: pff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pff_user -d pff_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run pytest
        env:
          SECRET_KEY: ci-secret-key-1234567890ABCdefGhijKLMN
          API_KEY: ci-api-key-1234567890ABCdefGhijKLMNop
          TEST_DATABASE_URL: postgresql://pff_user:ci-postgres-pass@localhost:5432/pff_test
        run: poetry run pytest -q

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pip audit
        run: echo "Security scan placeholder"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          target: runtime-cpu
          tags: pff:ci
          build-args: |
            PFF_ACCELERATOR=cpu
          cache-from: type=gha,scope=pff-runtime-cpu
          cache-to: type=gha,mode=max,scope=pff-runtime-cpu

      - name: Enforce Docker image budget
        run: |
          mkdir -p outputs/benches/docker
          ./scripts/package/measure-image-sizes.sh \
            --fail-on-budget \
            --output outputs/benches/docker/image-sizes-ci.tsv \
            pff:ci
          cat outputs/benches/docker/image-sizes-ci.tsv

      - name: Upload Docker image budget report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image-size-budget
          path: outputs/benches/docker/image-sizes-ci.tsv
          retention-days: 14

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy placeholder
        run: echo "Deploy disabled in this workflow"
