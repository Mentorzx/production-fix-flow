[tool.poetry]
name = "production-fix-flow"
version = "6.0.0"
description = "Production Fix Flow - Orchestrator for API sequences"
authors = ["Alex Lira"]
readme = "README.md"
packages = [{ include = "pff", from = "src" }]
source = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", priority = "explicit" },
    { name = "pytorch-cu121", url = "https://download.pytorch.org/whl/cu121", priority = "explicit" },
    { name = "pytorch-cu124", url = "https://download.pytorch.org/whl/cu124", priority = "explicit" }
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.128.0"
python-multipart = "0.0.20"
uvicorn = "0.40.0"
httpx = "0.28.1"
asyncpg = "0.31.0"
celery = "5.6.2"
redis = "7.1.0"
bcrypt = "5.0.0"
PyJWT = "2.10.1"
polars = "1.37.1"
numpy = "2.4.1"
duckdb = "1.4.4"
mlflow = "3.8.1"
optuna = "4.7.0"
scikit-learn = "1.8.0"
shap = "0.50.0"
numba = "0.63.0b1"
simpleeval = "1.0.3"
slowapi = "0.1.9"
ray = "2.53.0"
dask = "2026.1.1"
matplotlib = "3.10.8"
seaborn = "0.13.2"
plotly = "6.5.2"
loguru = "0.7.3"
pydantic = "2.12.5"
pydantic-settings = "2.12.0"
python-dotenv = "1.2.1"
PyYAML = "6.0.3"
rich = "14.3.1"
aiofile = "3.9.0"
aiobreaker = "1.2.0"
aiocache = "0.12.3"
dependency-injector = "4.48.3"
orjson = "3.11.5"
msgspec = "0.20.0"
zstandard = "0.25.0"
"ruamel.yaml" = "0.19.1"
pyarrow = "22.0.0"
pyperclip = "1.11.0"
colorlog = "6.10.1"
triton = { version = "3.2.0", markers = "python_version < '3.15'" }
faiss-cpu = { version = "1.13.2", markers = "python_version < '3.15'" }
transformers = "5.0.0"
granian = "^2.6.1"
uvloop = "^0.22.1"
connectorx = "0.4.5"
psutil = "^7.2.2"
nvidia-ml-py = "^13.590.48"
torch = { version = "2.6.0+cu124", source = "pytorch-cu124" }
psycopg2-binary = "^2.9.11"
lancedb = "^0.29.2"


[tool.poetry.dependencies.pywin32]
version = "310"
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
black = "26.1.0"
flake8 = "^7.3.0"
mypy = "1.19.1"
ipython = "9.9.0"
ruff = "0.14.14"
cmaes = "^0.12.0"
scipy = "^1.17.0"
optunahub = "^0.4.0"

[tool.poetry.scripts]
pff = "pff.drivers.cli.main:cli_entrypoint"

[tool.poetry.plugins."pff.kgc_strategies"]
kg = "pff.application.learn_use_case:KGTrainingStrategy"
kgc = "pff.application.learn_use_case:KGCTrainingStrategy"
all = "pff.application.learn_use_case:FullPipelineStrategy"

[tool.poetry.extras]
windows = ["pywin32"]

[tool.ruff]
line-length = 100
cache-dir = "outputs/.cache/ruff"

[tool.ruff.lint]
ignore = ["E501"]
exclude = ["*.html"]

[tool.flake8]
max-line-length = 999
extend-ignore = ["E501"]
exclude = [
    ".venv",
    "outputs",
    "data",
    "node_modules",
    "dist",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
ignore_errors = true
cache_dir = "~/.cache/mypy"
exclude = "(^\\.venv/|^outputs/|^data/|^scripts/|^tests/)"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
