                                                <ContourPlot trials={filteredTrials} />
                                            </Card>

                                            {/* NEW: Interaction Plot - Paper Section 5.2 */}
                                            <Card 
                                                specId="interaction"
                                                title={CHART_CONTRACT.interaction.title}
                                                icon={Filter}
                                                className="min-h-[350px]"
                                                helpText={CHART_CONTRACT.interaction.desc}
                                                action={<ExportMenu data={{ trials: filteredTrials, importances: data.importances }} filename="interaction_plot" minimal />}
                                            >
                                                <InteractionPlot trials={filteredTrials} importances={data.importances} />
                                            </Card>

                                            {/* NEW: Timeline Plot - Paper Section 6 */}
                                            <Card 
                                                specId="timeline"
                                                title={CHART_CONTRACT.timeline.title}
                                                icon={Clock}
                                                className="min-h-[350px]"
                                                helpText={CHART_CONTRACT.timeline.desc}
                                                action={<ExportMenu data={filteredTrials} filename="timeline" minimal />}
                                            >
                                                <TimelinePlot trials={filteredTrials} />
                                            </Card>

                                            {/* NEW: Hypervolume - Paper Section 4.3 */}
                                            <Card 
                                                specId="hypervolume"
                                                title={CHART_CONTRACT.hypervolume.title}
                                                icon={TargetIcon}
                                                className="min-h-[300px]"
                                                helpText={CHART_CONTRACT.hypervolume.desc}
                                                action={<ExportMenu data={filteredTrials} filename="hypervolume" minimal />}
                                            >
                                                <HypervolumeCard trials={filteredTrials} />
                                            </Card>

                                            {/* NEW: Search Space Table - Paper Section 6.1 */}
                                            <Card 
                                                specId="search_space_table"
                                                title={CHART_CONTRACT.search_space_table.title}
                                                icon={TableIcon}
                                                className="min-h-[300px]"
                                                helpText={CHART_CONTRACT.search_space_table.desc}
                                                action={<ExportMenu data={data.searchSpace} filename="search_space" minimal />}
                                            >
                                                <SearchSpaceTable searchSpace={data.searchSpace} />
                                            </Card>

                                            {/* NEW: PC Comparison Table - Paper Section 6.2 */}
                                            <Card 
                                                specId="pc_comparison"
                                                title={CHART_CONTRACT.pc_comparison.title}
                                                icon={GitMerge}
                                                className="min-h-[280px]"
                                                helpText={CHART_CONTRACT.pc_comparison.desc}
                                            >
                                                <PCComparisonTable />
                                            </Card>
                                        </>
                                    )}
                                </div>
                            )}

                            {/* Advanced Tab */}
                            {activeTab === 'advanced' && (
                                <div className={`grid grid-cols-12 gap-6 animate-slide-${tabDirection}`}>
                                    {viewMode === 'study' ? (
                                        <>
                                            <Card 
                                                title={`Slice Plot: ${detectedParams.lr || 'LR'} × Objetivo`}
                                                icon={Search} 
                                                className="col-span-12 lg:col-span-6 min-h-[350px]"
                                                helpText="Tech: Distribuição marginal do parâmetro. | Simple: Como esse parâmetro afeta a nota final."
                                                action={<ExportMenu data={sliceDataLr} filename="slice_lr" minimal />}
                                            >
                                                <ResponsiveContainer width="100%" height="100%">
                                                    {sliceDataLr.length > 0 ? (
                                                        <ScatterChart margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                                                            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                                                            <XAxis 
                                                                type="number" 
                                                                dataKey="x" 
                                                                name={detectedParams.lr || 'LR'} 
                                                                stroke={colors.text} 
                                                                tick={{fontSize:10}} 
                                                                domain={['auto', 'auto']}
                                                                label={{ value: detectedParams.lr || 'Learning Rate', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                                                            />
                                                            <YAxis 
                                                                type="number" 
                                                                dataKey="y" 
                                                                name="Score" 
                                                                stroke={colors.text} 
                                                                tick={{fontSize:10}} 
                                                                domain={['auto', 'auto']}
                                                                label={{ value: 'Objetivo', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }}
                                                            />
                                                            <RechartsTooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={chartTheme.tooltip} />
                                                            <Legend 
                                                                verticalAlign="top" 
                                                                align="center"
                                                                wrapperStyle={{ fontSize: 10, paddingBottom: 10 }}
                                                            />
                                                            <Scatter name="Trials" data={sliceDataLr} fill={colors.primary} />
                                                        </ScatterChart>
                                                    ) : (
                                                        <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                                                            {detectedParams.lr ? 'Sem dados — aguardando trials completos' : 'Sem parâmetro de LR detectado'}
                                                        </div>
                                                    )}
                                                </ResponsiveContainer>
                                            </Card>

                                             <Card 
                                                title={`Slice Plot: ${detectedParams.embed || 'Embedding'} × Objetivo`}
                                                icon={Search} 
                                                className="col-span-12 lg:col-span-6 min-h-[350px]"
                                                helpText="Tech: Distribuição marginal do parâmetro. | Simple: Como esse parâmetro afeta a nota final."
                                                action={<ExportMenu data={sliceDataEmbed} filename="slice_embedding" minimal />}
                                            >
                                                <ResponsiveContainer width="100%" height="100%">
                                                    {sliceDataEmbed.length > 0 ? (
                                                        <ScatterChart margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                                                            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                                                            <XAxis 
                                                                type="number" 
                                                                dataKey="x" 
                                                                name={detectedParams.embed || 'Param'} 
                                                                stroke={colors.text} 
                                                                tick={{fontSize:10}}
                                                                label={{ value: detectedParams.embed || 'Embedding Dim', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                                                            />
                                                            <YAxis 
                                                                type="number" 
                                                                dataKey="y" 
                                                                name="Score" 
                                                                stroke={colors.text} 
                                                                tick={{fontSize:10}} 
                                                                domain={['auto', 'auto']}
                                                                label={{ value: 'Objetivo', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }}
                                                            />
                                                            <RechartsTooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={chartTheme.tooltip} />
                                                            <Legend 
                                                                verticalAlign="top" 
                                                                align="center"
                                                                wrapperStyle={{ fontSize: 10, paddingBottom: 10 }}
                                                            />
                                                            <Scatter name="Trials" data={sliceDataEmbed} fill={colors.success} />
                                                        </ScatterChart>
                                                    ) : (
                                                        <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                                                            {detectedParams.embed ? 'Sem dados — aguardando trials completos' : 'Sem parâmetro de embedding detectado'}
                                                        </div>
                                                    )}
                                                </ResponsiveContainer>
                                            </Card>

                                            <Card 
                                                title="Distribuição: Duração × Score" 
                                                icon={Search} 
                                                className="col-span-12 lg:col-span-6 min-h-[350px]"
                                                helpText="Tech: Distribuição bivariada de duração e score. | Simple: Relação direta entre tempo de treino e qualidade do modelo."
                                                action={<ExportMenu data={completedTrials} filename="duration_vs_score" minimal />}
                                            >
                                                <ResponsiveContainer width="100%" height="100%">
                                                    {completedTrials.length > 0 ? (
                                                    <ScatterChart margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                                                        <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                                                        <XAxis 
                                                            type="number" 
                                                            dataKey="duration" 
                                                            name="Duration" 
                                                            unit="s" 
                                                            stroke={colors.text} 
                                                            tick={{fontSize:10}}
                                                            label={{ value: 'Duração (s)', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                                                        />
                                                        <YAxis 
                                                            type="number" 
                                                            dataKey="value" 
                                                            name="Score" 
                                                            stroke={colors.text} 
                                                            tick={{fontSize:10}} 
                                                            domain={['auto', 'auto']}
                                                            label={{ value: 'Objetivo', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }}
                                                        />
                                                        <RechartsTooltip cursor={{ strokeDasharray: '3 3' }} contentStyle={chartTheme.tooltip} />
                                                        <Legend 
                                                            verticalAlign="top" 
                                                            align="center"
                                                            wrapperStyle={{ fontSize: 10, paddingBottom: 10 }}
                                                        />
                                                        <Scatter name="Trials" data={completedTrials} fill={colors.primary} />
                                                    </ScatterChart>
                                                    ) : (
                                                        <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">Sem dados — aguardando trials completos</div>
                                                    )}
                                                </ResponsiveContainer>
                                            </Card>

                                            <Card 
                                                specId="full_evolution"
                                                title={CHART_CONTRACT.full_evolution.title} 
                                                icon={TrendingUp} 
                                                className="col-span-12 lg:col-span-6 min-h-[400px] overflow-visible"
                                                helpText="Tech: Evolução multivariada de todas as métricas rastreadas. | Simple: O painel de controle completo. Veja se melhorar uma coisa (ex: precisão) não está piorando outra (ex: recall)."
                                                action={<ExportMenu data={trials} filename="full_metrics_evolution" minimal />}
                                            >
                                                <MetricsEvolutionChart trials={trials} />
                                            </Card>

                                                                                    </>
                                    ) : (
                                        <>
                                            <Card 
                                                title="Monitor de Hardware" 
                                                icon={Cpu} 
                                                className="col-span-12 lg:col-span-6 min-h-[300px]" 
                                                glow
                                                action={<ExportMenu data={data.liveStatus?.hardware} filename="hardware_snapshot" minimal />}
                                            >
                                                 <HardwareMonitor liveData={data.liveStatus?.hardware} />
                                             </Card>

                                            <Card 
                                                title="Saúde do Gradiente" 
                                                icon={Activity} 
                                                className="col-span-12 lg:col-span-6 min-h-[300px]" 
                                                glow
                                                action={<ExportMenu data={liveTrialData} filename="gradient_health" minimal />}
                                            >
                                                <GradientHealthChart liveData={liveTrialData} />
                                            </Card>

                                            <Card 
                                                title="Configuração Bruta (JSON)" 
                                                icon={Sliders} 
                                                className="col-span-12 min-h-[200px]"
                                                action={<ExportMenu data={currentParams} filename="raw_config" minimal />}
                                            >
                                                <div className="absolute inset-0 p-4 overflow-auto custom-scrollbar">
                                                    <pre className="text-[10px] text-zinc-400 font-mono whitespace-pre-wrap">
                                                        {JSON.stringify(currentParams, null, 2) || 'Sem configuração disponível'}
                                                    </pre>
                                                </div>
                                            </Card>
                                        </>
                                    )}
                                </div>
                            )}

                            {/* Forecast Tab (Projections) */}
                            {activeTab === 'forecast' && (
                                <div className={`grid grid-cols-12 gap-6 animate-slide-${tabDirection}`}>
                                    {viewMode === 'study' ? (
                                        <>
                                            <div className="col-span-12 lg:col-span-6">
                                                <EstimatedScoreCard projection={studyProjections} currentBest={bestTrial.value} totalTrials={data.totalTrials} />
                                            </div>
                                            <div className="col-span-12 lg:col-span-6">
                                                <OptimizationVelocityCard projection={studyProjections} variance={studyProjections.variance} />
                                            </div>
                                            
                                            <Card 
                                                specId="forecast"
                                                title={CHART_CONTRACT.forecast.title}
                                                icon={TrendingUp} 
                                                className="col-span-12 min-h-[350px]" 
                                                glow
                                                helpText={CHART_CONTRACT.forecast.desc}
                                                action={<ExportMenu data={chartData} filename="convergence_forecast" minimal />}
                                            >
                                                {trials.length >= 2 ? (
                                                    <div className="w-full h-[360px]">
                                                        <ResponsiveContainer width="100%" height="100%">
                                                            <ComposedChart data={chartData} margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                                                                <defs>
                                                                    <linearGradient id="colorRaw" x1="0" y1="0" x2="0" y2="1">
                                                                        <stop offset="5%" stopColor={colors.primary} stopOpacity={0.3}/>
                                                                        <stop offset="95%" stopColor={colors.primary} stopOpacity={0}/>
                                                                    </linearGradient>
                                                                </defs>
                                                                <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                                                                <XAxis 
                                                                    dataKey="x" 
                                                                    type="number" 
                                                                    domain={['dataMin', 'dataMax']}
                                                                    stroke={colors.text}
                                                                    tick={{ fill: colors.text, fontSize: 10 }}
                                                                    tickLine={{ stroke: colors.border }}
                                                                    axisLine={{ stroke: colors.border }}
                                                                    tickFormatter={(val) => {
                                                                        const matching = chartData.find(d => d.x === val);
                                                                        const id = matching ? matching.id : (val + 1);
                                                                        return id <= 3 ? '-' : (id - 3);
                                                                    }}
                                                                    label={{ value: 'Trial', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                                                                />
                                                                <YAxis 
                                                                    stroke={colors.text}
                                                                    tick={{ fill: colors.text, fontSize: 10 }}
                                                                    tickLine={{ stroke: colors.border }}
                                                                    axisLine={{ stroke: colors.border }}
                                                                    label={{ value: 'MRR', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }} 
                                                                />
                                                                <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: 11 }} />
                                                                <Legend 
                                                                    verticalAlign="top"
                                                                    align="center"
                                                                    wrapperStyle={{ fontSize: 10, paddingBottom: 5 }} 
                                                                    formatter={(val) => renderLegendWithHints(val, {
                                                                        "Real": { tech: "Valor objetivo observado em cada trial.", simple: "A nota real que o modelo tirou em cada tentativa." },
                                                                        "Tendência (OLS)": { tech: "Regressão Linear por Mínimos Quadrados.", simple: "A linha de tendência geral: para onde os resultados estão caminhando." }
                                                                    })}
                                                                />
                                                                <Area type="monotone" dataKey="value" stroke={colors.primary} strokeWidth={3} fill="url(#colorRaw)" activeDot={{r: 6, strokeWidth: 0, fill: '#818cf8'}} name="Real" />
                                                                <Line type="monotone" dataKey="linearFit" stroke="#fbbf24" strokeWidth={2} strokeDasharray="3 3" dot={false} name="Tendência (OLS)" />
                                                            </ComposedChart>
                                                        </ResponsiveContainer>
                                                    </div>
                                                ) : (
                                                    <div className="h-full flex flex-col items-center justify-center text-zinc-600">
                                                        <TrendingUp size={48} className="mb-4 opacity-50" />
                                                        <p className="text-sm font-medium">Sem dados — precisa de pelo menos 2 trials</p>
                                                        <div className="mt-2 text-[10px] text-zinc-500 uppercase tracking-widest font-mono">
                                                            Atual: {trials.length} trials
                                                        </div>
                                                    </div>
                                                )}
                                            </Card>
                                        </>
                                    ) : (
                                        <>
                                            <Card 
                                                title="Extrapolação de Perda" 
                                                icon={TrendingUp} 
                                                className="col-span-12 lg:col-span-8 min-h-[350px]" 
                                                glow
                                                delay={100}
                                                helpText="Tech: Extrapolação da curva de perda. | Simple: Previsão de até onde a 'nota de erro' cairia se o treino continuasse."
                                                action={<ExportMenu data={liveTrialData} filename="loss_extrapolation" minimal />}
                                            >
                                                <LossProjection liveData={liveTrialData} />
                                            </Card>

                                            <Card 
                                                title="Probabilidade de Parada Antecipada" 
                                                icon={AlertTriangle} 
                                                className="col-span-12 lg:col-span-4 min-h-[350px]" 
                                                glow
                                                delay={200}
                                                helpText="Tech: Probabilidade de parada antecipada baseada na paciência. | Simple: Chance do professor encerrar a prova antes do tempo porque o aluno parou de melhorar."
                                                action={<ExportMenu data={liveTrialData} filename="early_stopping_prob" minimal />}
                                            >
                                                <EarlyStoppingGauge liveData={liveTrialData} />
                                            </Card>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
