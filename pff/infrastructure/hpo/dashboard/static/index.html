                                        opacity={0.7 + (entry.value || 0) * 0.3}
                                    />
                                ))}
                            </Bar>
                        </BarChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        // Interaction Plot (Conditional Importance) - Paper Section 5.2
        const InteractionPlot = ({ trials, importances }) => {
            const { params, interactions } = useMemo(() => {
                if (!trials || trials.length < 10 || !importances) {
                    return { params: [], interactions: [] };
                }
                
                const completed = trials.filter(t => t.state === 'COMPLETE' && t.value != null);
                if (completed.length < 10) return { params: [], interactions: [] };
                
                // Get top 5 important params
                const topParams = Object.entries(importances)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(e => e[0]);
                
                if (topParams.length < 2) return { params: [], interactions: [] };
                
                // Calculate pairwise interactions (simplified correlation-based)
                const interactionMatrix = [];
                
                for (let i = 0; i < topParams.length; i++) {
                    for (let j = 0; j < topParams.length; j++) {
                        if (i === j) {
                            interactionMatrix.push({ row: topParams[i], col: topParams[j], value: 1.0 });
                            continue;
                        }
                        
                        // Simplified: correlation between param values weighted by score
                        const paramA = topParams[i];
                        const paramB = topParams[j];
                        
                        const pairs = completed
                            .map(t => ({ 
                                a: t.params?.[paramA], 
                                b: t.params?.[paramB], 
                                score: t.value 
                            }))
                            .filter(p => p.a != null && p.b != null && typeof p.a === 'number' && typeof p.b === 'number');
                        
                        if (pairs.length < 5) {
                            interactionMatrix.push({ row: topParams[i], col: topParams[j], value: 0 });
                            continue;
                        }
                        
                        // Compute simple correlation coefficient
                        const meanA = pairs.reduce((s, p) => s + p.a, 0) / pairs.length;
                        const meanB = pairs.reduce((s, p) => s + p.b, 0) / pairs.length;
                        
                        let num = 0, denA = 0, denB = 0;
                        pairs.forEach(p => {
                            const dA = p.a - meanA;
                            const dB = p.b - meanB;
                            num += dA * dB * p.score; // Weight by score
                            denA += dA * dA;
                            denB += dB * dB;
                        });
                        
                        const corr = Math.abs(denA * denB) > 0 ? num / (Math.sqrt(denA) * Math.sqrt(denB)) : 0;
                        const normalized = Math.max(-1, Math.min(1, corr / (Math.max(...pairs.map(p => p.score)) || 1)));
                        
                        interactionMatrix.push({ row: topParams[i], col: topParams[j], value: normalized });
                    }
                }
                
                return { params: topParams, interactions: interactionMatrix };
            }, [trials, importances]);
            
            if (params.length < 2) {
                return (
                    <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                        Dados insuficientes para plot de interação (min. 10 trials, 2+ parâmetros importantes)
                    </div>
                );
            }
            
            const getColor = (value) => {
                const abs = Math.abs(value);
                if (abs < 0.3) return 'bg-zinc-700';
                if (value > 0) return abs > 0.6 ? 'bg-teal-500' : 'bg-teal-700';
                return abs > 0.6 ? 'bg-rose-500' : 'bg-rose-700';
            };
            
            return (
                <div className="h-full flex flex-col p-2">
                    <div className="text-[9px] text-zinc-500 mb-2">
                        Interação ponderada por score (verde = sinergia positiva, vermelho = negativa)
                    </div>
                    <div className="flex-1 overflow-auto">
                        <div className="grid gap-1 text-[9px] font-mono" style={{ gridTemplateColumns: `auto repeat(${params.length}, minmax(0, 1fr))` }}>
                            <div></div>
                            {params.map(p => (
                                <div key={p} className="text-center text-zinc-400 truncate px-1" title={p}>
                                    {p.replace(/_dim|_size|learning_|adversarial_/, '').slice(0, 6)}
                                </div>
                            ))}
                            {params.map((row, ri) => (
                                <React.Fragment key={row}>
                                    <div className="text-right text-zinc-400 pr-2 truncate" title={row}>
                                        {row.replace(/_dim|_size|learning_|adversarial_/, '').slice(0, 6)}
                                    </div>
                                    {params.map((col, ci) => {
                                        const cell = interactions.find(i => i.row === row && i.col === col);
                                        const val = cell?.value || 0;
                                        return (
                                            <div 
                                                key={col}
                                                className={`aspect-square rounded ${getColor(val)} flex items-center justify-center text-[8px] text-white font-bold`}
                                                title={`${row} × ${col}: ${val.toFixed(3)}`}
                                            >
                                                {ri === ci ? '–' : val.toFixed(2)}
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Hypervolume Card - Paper Section 4.3
        const HypervolumeCard = ({ trials }) => {
            const { hypervolume, history, refPoint } = useMemo(() => {
                if (!trials || trials.length < 3) {
                    return { hypervolume: 0, history: [], refPoint: [0, 0] };
                }
                
                const completed = trials
                    .filter(t => t.state === 'COMPLETE' && t.value != null && t.duration > 0)
                    .map(t => ({ score: t.value, duration: t.duration }));
                
                if (completed.length < 3) return { hypervolume: 0, history: [], refPoint: [0, 0] };
                
                // Reference point: worst values
                const maxDuration = Math.max(...completed.map(p => p.duration));
                const minScore = Math.min(...completed.map(p => p.score));
                const refPoint = [maxDuration * 1.1, minScore - 0.1];
                
                // Calculate hypervolume incrementally
                const hvHistory = [];
                let cumulativeHV = 0;
                
                const paretoFront = [];
                
                completed.forEach((point, idx) => {
                    // Check if dominated
                    let dominated = false;
                    for (const p of paretoFront) {
                        if (p.score >= point.score && p.duration <= point.duration) {
                            dominated = true;
                            break;
                        }
                    }
                    
                    if (!dominated) {
                        // Remove points dominated by new point
                        const newFront = paretoFront.filter(p => 
                            !(point.score >= p.score && point.duration <= p.duration)
                        );
                        newFront.push(point);
                        paretoFront.length = 0;
                        paretoFront.push(...newFront);
                    }
                    
                    // Simple hypervolume calculation (sum of rectangles)
                    const sorted = [...paretoFront].sort((a, b) => a.duration - b.duration);
                    let hv = 0;
                    for (let i = 0; i < sorted.length; i++) {
                        const width = (i === sorted.length - 1 ? refPoint[0] : sorted[i + 1].duration) - sorted[i].duration;
                        const height = sorted[i].score - refPoint[1];
                        hv += width * height;
                    }
                    
                    hvHistory.push({ trial: idx + 1, hypervolume: Math.max(0, hv) });
                    cumulativeHV = Math.max(0, hv);
                });
                
                return { hypervolume: cumulativeHV, history: hvHistory, refPoint };
            }, [trials]);
            
            if (history.length === 0) {
                return (
                    <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                        Dados insuficientes para cálculo de hypervolume
                    </div>
                );
            }
            
            return (
                <div className="h-full flex flex-col">
                    <div className="flex items-center justify-between px-3 pt-2">
                        <div>
                            <div className="text-[10px] text-zinc-500 uppercase">Hypervolume Atual</div>
                            <div className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-500">
                                {hypervolume.toFixed(2)}
                            </div>
                        </div>
                        <div className="text-[9px] text-zinc-600 text-right">
                            Ref: ({refPoint[0].toFixed(1)}, {refPoint[1].toFixed(2)})
                        </div>
                    </div>
                    <div className="flex-1">
                        <ResponsiveContainer width="100%" height="100%">
                            <AreaChart data={history} margin={{ top: 10, right: 15, bottom: 20, left: 10 }}>
                                <defs>
                                    <linearGradient id="hvGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="5%" stopColor={colors.success} stopOpacity={0.3}/>
                                        <stop offset="95%" stopColor={colors.success} stopOpacity={0}/>
                                    </linearGradient>
                                </defs>
                                <XAxis dataKey="trial" stroke={colors.text} tick={{ fontSize: 9 }} />
                                <YAxis stroke={colors.text} tick={{ fontSize: 9 }} domain={['auto', 'auto']} />
                                <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, fontSize: 10 }} />
                                <Area type="monotone" dataKey="hypervolume" stroke={colors.success} fill="url(#hvGradient)" strokeWidth={2} />
                            </AreaChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            );
        };

        // Search Space Table - Paper Section 6.1
        const SearchSpaceTable = ({ searchSpace }) => {
            const tableData = useMemo(() => {
                if (!searchSpace || Object.keys(searchSpace).length === 0) return [];
                
                return Object.entries(searchSpace).map(([name, dist]) => {
                    let type = 'Unknown';
                    let range = 'N/A';
                    let scale = 'Linear';
                    
                    if (dist.name === 'FloatDistribution' || dist.name === 'IntDistribution') {
                        type = dist.name === 'FloatDistribution' ? 'Float' : 'Int';
                        const low = dist.attributes?.low ?? dist.low ?? '?';
                        const high = dist.attributes?.high ?? dist.high ?? '?';
                        range = `[${low}, ${high}]`;
                        scale = (dist.attributes?.log ?? dist.log) ? 'Log' : 'Linear';
                    } else if (dist.name === 'CategoricalDistribution') {
                        type = 'Categorical';
                        const choices = dist.attributes?.choices ?? dist.choices ?? [];
                        range = choices.slice(0, 3).join(', ') + (choices.length > 3 ? '...' : '');
                        scale = '-';
                    } else if (typeof dist === 'object') {
                        type = dist.type || 'Unknown';
                        if (dist.low !== undefined && dist.high !== undefined) {
                            range = `[${dist.low}, ${dist.high}]`;
                            scale = dist.log ? 'Log' : 'Linear';
                        }
                    }
                    
                    return { name, type, range, scale };
                });
            }, [searchSpace]);
            
            if (tableData.length === 0) {
                return (
                    <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                        Search Space não disponível
                    </div>
                );
            }
            
            return (
                <div className="h-full overflow-auto custom-scrollbar">
                    <table className="w-full text-left border-collapse" role="table" aria-label="Search Space Configuration">
                        <thead className="sticky top-0 bg-zinc-900 z-10">
                            <tr>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Hiperparâmetro</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Tipo</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Faixa</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Escala</th>
                            </tr>
                        </thead>
                        <tbody className="text-xs font-mono">
                            {tableData.map(row => (
                                <tr key={row.name} className="border-b border-zinc-800/50 hover:bg-zinc-800/30">
                                    <td className="py-2 px-2 text-indigo-400">{row.name}</td>
                                    <td className="py-2 px-2 text-zinc-400">{row.type}</td>
                                    <td className="py-2 px-2 text-teal-400">{row.range}</td>
                                    <td className="py-2 px-2">
                                        <span className={`px-1.5 py-0.5 rounded text-[9px] ${row.scale === 'Log' ? 'bg-purple-500/20 text-purple-400' : 'bg-zinc-700 text-zinc-400'}`}>
                                            {row.scale}
                                        </span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        // PC Comparison Table - Paper Section 6.2
        const PCComparisonTable = () => {
            const variants = [
                {
                    name: 'PC1',
                    method: 'Limite Inferior (Lower Bound)',
                    complexity: 'Baixa (O(1) após compilação)',
                    ruleSet: 'Pequeno (Singleton)',
                    precision: 'Aproximada',
                    color: 'text-blue-400'
                },
                {
                    name: 'PC2',
                    method: 'Cálculo Exato (Prop. 2)',
                    complexity: 'Alta (Dependente de Contextos)',

                    precision: 'Exata',
                    color: 'text-teal-400',
                    highlight: true
                },
                {
                    name: 'PC3',
                    method: 'Caminhada Gulosa (Greedy)',
                    complexity: 'Variável (Iterativa)',
                    ruleSet: 'Grande (Exploração completa)',
                    precision: 'Aproximada',
                    color: 'text-purple-400'
                }
            ];
            
            return (
                <div className="h-full overflow-auto custom-scrollbar">
                    <table className="w-full text-left border-collapse" role="table" aria-label="PC Variants Comparison">
                        <thead className="sticky top-0 bg-zinc-900 z-10">
                            <tr>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Variante</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Método de Inferência</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Complexidade</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Conjunto de Regras</th>
                                <th className="text-[10px] text-zinc-500 uppercase font-semibold py-2 px-2 border-b border-zinc-800">Precisão</th>
                            </tr>
                        </thead>
                        <tbody className="text-xs">
                            {variants.map(v => (
                                <tr 
                                    key={v.name} 
                                    className={`border-b border-zinc-800/50 ${v.highlight ? 'bg-teal-500/10' : 'hover:bg-zinc-800/30'}`}
                                >
                                    <td className={`py-2 px-2 font-bold ${v.color}`}>
                                        {v.name}
                                        {v.highlight && <span className="ml-1 text-[8px] bg-teal-500/30 px-1 rounded">ATUAL</span>}
                                    </td>
                                    <td className="py-2 px-2 text-zinc-300">{v.method}</td>
                                    <td className="py-2 px-2 text-zinc-400">{v.complexity}</td>
                                    <td className="py-2 px-2 text-zinc-400">{v.ruleSet}</td>
                                    <td className="py-2 px-2">
                                        <span className={`px-1.5 py-0.5 rounded text-[9px] ${v.precision === 'Exata' ? 'bg-teal-500/20 text-teal-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                            {v.precision}
                                        </span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <div className="mt-3 text-[9px] text-zinc-600 px-2">
                        <strong>Nota:</strong> Este sistema usa PC2 (Proposição 2) para cálculo exato de probabilidades sobre contextos de regras.
                    </div>
                </div>
            );
        };

        // === END NEW COMPONENTS ===

        const MetricsHistoryTable = ({ trials }) => {
            const allMetricKeys = useMemo(() => {
                if (!trials || trials.length === 0) return [];
                // Force core metrics order: SCORE -> BEST_MRR -> MCC -> AP -> PR_AUC -> MRR -> AUC
                const priorityKeys = ['score', 'best_mrr', 'mcc', 'ap', 'pr_auc', 'mrr', 'auc'];
                const keys = new Set(priorityKeys);
                
                trials.forEach(t => {
                    const m = t.metrics || {};
                    Object.keys(m).forEach(k => {
                        if (typeof m[k] === 'number') keys.add(k);
                    });
                    // Also check root keys if missing in metrics
                    if (t.mrr !== undefined) keys.add('mrr');
                    if (t.best_mrr !== undefined) keys.add('best_mrr');
                    if (t.hits10 !== undefined) keys.add('hits@10');
                    if (t.hits1 !== undefined) keys.add('hits@1');
                    if (t.mcc !== undefined) keys.add('mcc');
                    // Add score explicitly if not in metrics
                    if (t.value !== undefined) keys.add('score');
                });
                
                // Sort keys: priority first, then alphabetical
                return Array.from(keys).sort((a, b) => {
                    const idxA = priorityKeys.indexOf(a);
                    const idxB = priorityKeys.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
            }, [trials]);

            return (
                <div className="absolute inset-0 overflow-auto custom-scrollbar">
                    <table className="w-full text-left border-collapse whitespace-nowrap">
                        <thead className="sticky top-0 bg-[#09090b] z-10 text-[9px] text-zinc-500 uppercase tracking-wider font-semibold shadow-sm">
                            <tr>
                                <th className="pb-2 pl-4 py-3 bg-zinc-900/90 backdrop-blur">Trial</th>
                                {allMetricKeys.map(c => {
                                    const lowerKey = c.toLowerCase();
                                    const lowerIsBetter = ['nll', 'brier', 'ece', 'loss', 'val_loss', 'train_loss', 'duration'].includes(lowerKey);
                                    // Default hints if not in global map
                                    const defaultHints = { tech: c.toUpperCase(), simple: "" };
                                    const hint = (typeof metricHints !== 'undefined' && metricHints[lowerKey]) ? metricHints[lowerKey] : defaultHints;

                                    return (
                                        <th key={c} className="pb-2 px-2 py-3 text-right bg-zinc-900/90 backdrop-blur border-l border-zinc-800/50">
                                            <RichTooltip 
                                                trigger={c.toUpperCase()} 
                                                title={c.toUpperCase()} 
                                                tech={hint.tech} 
                                                simple={hint.simple} 
                                                direction={lowerIsBetter ? 'down' : 'up'} 
                                                align="right" 
                                                placement="bottom" 
                                                width="w-64" 
                                            />
                                        </th>
                                    );
                                })}
                            </tr>
                        </thead>
                        <tbody className="text-xs font-mono">
                            {trials.slice().reverse().map(t => {
                                const m = t.metrics || {};
                                return (
                                    <tr key={t.id} className="border-b border-zinc-800/50 hover:bg-zinc-800/30 transition-colors">
                                        <td className="py-2 pl-4 font-bold text-zinc-400 whitespace-nowrap">
                                            #{t.id}
                                            {t.id <= 3 && (
                                                <span className="ml-1 text-[9px] text-amber-500 bg-amber-500/10 px-1 rounded border border-amber-500/20" title="Warm-start trial (pre-loaded)">WARM</span>
                                            )}
                                        </td>
                                        {allMetricKeys.map(c => {
                                            let val = m[c];
                                            // Handle root aliases if missing in metrics dict
                                            if (val === undefined) {
                                                if (c === 'mrr') val = t.mrr;
                                                else if (c === 'best_mrr') val = t.best_mrr;
                                                else if (c === 'hits@10') val = t.hits10;
                                                else if (c === 'hits@1') val = t.hits1;
                                                else if (c === 'mcc') val = t.mcc;
                                                else if (c === 'auc') val = t.auc;
                                                else val = t[c];
                                            }
                                            // Smart resolve for zeroed MRR in table too
                                            if (c === 'mrr' && val === 0 && (t.best_mrr > 0)) {
                                                val = t.best_mrr;
                                            }
                                            return (
                                                <td key={c} className={`py-2 px-2 text-right border-l border-zinc-800/50 ${val === 0 ? 'text-zinc-600' : 'text-zinc-300'}`}>
                                                    {typeof val === 'number' ? val.toFixed(4) : '-'}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };

        const EstimatedScoreCard = ({ projection, currentBest, totalTrials }) => {
            if (!projection || projection.slope === 0) return <div className="p-4 rounded-xl border border-zinc-800 bg-zinc-900/30 h-full flex items-center justify-center text-zinc-500 italic">Dados insuficientes para projeção</div>;

            const targetTrial = totalTrials || 100;
            const predictedScore = projection.predictedValue || 0;
            const improvementRate = (projection.slope * 100).toFixed(4);
            
            return (
                <div className="relative p-6 rounded-xl border border-zinc-800 bg-zinc-900/40 overflow-hidden flex flex-col justify-center h-full">
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="text-xs font-bold uppercase text-zinc-300">SCORE ESTIMADO TRIAL {targetTrial}</h3>
                    </div>
                    
                    <div className="flex items-center gap-4 mt-2">
                        <span className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-500">
                            {predictedScore.toFixed(4)}
                        </span>
                        <div className="text-[10px] text-zinc-500 leading-tight max-w-[120px]">
                            Predicted score based on current improvement rate of <span className="text-teal-400 font-bold">{improvementRate}%</span> per trial.
                        </div>
                    </div>
                </div>
            );
        };

        const OptimizationVelocityCard = ({ projection, variance }) => {
             const slope = projection?.slope || 0;
             const slopeVal = slope.toFixed(6);
             const varianceLevel = variance > 0.01 ? "High" : variance > 0.001 ? "Medium" : "Low";
             const varianceColor = variance > 0.01 ? "text-purple-400" : variance > 0.001 ? "text-indigo-400" : "text-teal-400";
             const varianceBarWidth = variance > 0.01 ? "90%" : variance > 0.001 ? "60%" : "30%";

             return (
                <div className="relative p-6 rounded-xl border border-zinc-800 bg-zinc-900/40 overflow-hidden flex flex-col justify-center h-full">
                    <div className="flex justify-between items-start mb-4">
                        <h3 className="text-xs font-bold uppercase text-zinc-300">VELOCIDADE DE OTIMIZAÇÃO</h3>
                    </div>

        const LossProjection = ({ liveData }) => {
            // Simple linear projection of the last 10 epochs
            const data = useMemo(() => {
                if (!liveData || liveData.length < 10) return [];
                const recent = liveData.slice(-10);
                const n = recent.length;
                
                // Simple regression on recent data
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                recent.forEach((d, i) => { 
                    sumX += i; 
                    sumY += d.loss; 
                    sumXY += i * d.loss; 
                    sumXX += i * i; 
                });
                
                const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;

                const lastEpoch = recent[n-1].epoch;
                const projection = [];
                
                // Project 20 epochs ahead
                for(let i=0; i<30; i++) {
                    const x = i; // relative x for regression
                    const projY = slope * x + intercept;
                    // Align with absolute epoch
                    projection.push({
                        epoch: lastEpoch + i - 9, // overlap slightly
                        loss: i < 10 ? recent[i].loss : null,
                        projected: Math.max(0, projY),
                        isFuture: i >= 10
                    });
                }
                return projection;
            }, [liveData]);

            if (data.length === 0) return <div className="h-full flex items-center justify-center text-zinc-600 text-xs italic">Sem dados — precisa de mais épocas para projeção</div>;

            return (

                                domain={['auto', 'auto']} 
                                label={{ value: 'Perda', angle: -90, position: 'insideLeft', offset: 10, fill: colors.text, fontSize: 10 }}
                            />
                            <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: 11 }} />
                            <Legend 
                                wrapperStyle={{ fontSize: 10, color: colors.text, paddingTop: 15 }} 
                                formatter={(val) => renderLegendWithHints(val, {

                                    "Projeção": { tech: "Extrapolação linear baseada nos últimos 10 epochs.", simple: "Para onde a curva de erro está indo se continuar assim." }
                                })}

                            <Line type="monotone" dataKey="projected" stroke={colors.success} strokeDasharray="5 5" strokeWidth={2} dot={false} name="Projeção" />
                        </ComposedChart>
                    </ResponsiveContainer>
                </div>
            );

        // --- DASHBOARD MAIN ---

        function Dashboard() {
            const [activeTab, setActiveTab] = useState('overview');
            const [viewMode, setViewMode] = useState('study'); 
            const [data, setData] = useState(INITIAL_DATA);
            const [currentTime, setCurrentTime] = useState(new Date().toLocaleTimeString());
            const [shockwaves, setShockwaves] = useState([]);
            const scrollRef = useRef(null);
            const dataRef = useRef(data);
            
            const trials = data.trials || [];
            const bestTrial = useMemo(() => trials.length > 0 
                ? trials.reduce((prev, current) => (prev.value > current.value) ? prev : current, trials[0])
                : { id: 0, value: 0, params: {} }, [trials]);

            const prevBestValue = usePrevious(bestTrial.value);

            useEffect(() => {
                if (prevBestValue !== undefined && bestTrial.value > prevBestValue && bestTrial.value > 0) {
                    const id = Date.now();
                    setShockwaves(prev => [...prev, id]);
                    setTimeout(() => {
                        setShockwaves(prev => prev.filter(sw => sw !== id));
                    }, 1000);
                }
            }, [bestTrial.value, prevBestValue]);

            // Trial Filters State
            const [filters, setFilters] = useState({
                includeWarmup: true,
                includePruned: true,
                onlyComplete: false,
                minScore: null,
                maxScore: null
            });

            // Real-time running detection with local timer
            const [isRunning, setIsRunning] = useState(false);
            useEffect(() => {
                const checkRunning = () => {
                    const candidate = data.liveStatus?.updated_at || data.updatedAt;
                    if (!candidate) {
                        setIsRunning(false);
                        return;
                    }
                    const lastUpdate = new Date(candidate).getTime();
                    const now = Date.now();
                    // Consider running if updated within last 30 seconds
                    setIsRunning((now - lastUpdate) < 30000);
                };
                
                checkRunning();
                const interval = setInterval(checkRunning, 2000);
                return () => clearInterval(interval);
            }, [data.liveStatus?.updated_at, data.updatedAt]);

            const _isRunningMemo = useMemo(() => {
                const candidate = data.liveStatus?.updated_at || data.updatedAt;
                if (!candidate) return false;
                const lastUpdate = new Date(candidate).getTime();
                const now = new Date().getTime();
                return (now - lastUpdate) < 30000;
            }, [data.updatedAt, data.liveStatus, currentTime]);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date().toLocaleTimeString()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                dataRef.current = data;
            }, [data]);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(`/api/data?t=${new Date().getTime()}`);
                        if (response.ok) {
                            const jsonData = await response.json();
                            setData(jsonData);
                        }
                    } catch (error) {
                        console.warn("Polling error:", error);
                    }
                };
                fetchData();
                const interval = setInterval(fetchData, 3000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                // No restriction - allow projections in both modes
            }, [viewMode, activeTab]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [trials.length]);

            // Sort trials to ensure logic works
            const sortedTrials = useMemo(() => [...trials].sort((a,b) => a.id - b.id), [trials]);

            // Filtered Trials based on user filters
            const filteredTrials = useMemo(() => {
                return sortedTrials.filter(t => {
                    // Warmup filter (trials with id <= 3 are warmup)
                    if (!filters.includeWarmup && t.id <= 3) return false;
                    // Pruned filter
                    if (!filters.includePruned && t.state === 'PRUNED') return false;
                    // Only complete filter
                    if (filters.onlyComplete && t.state !== 'COMPLETE') return false;
                    // Score range filters
                    if (filters.minScore !== null && t.value < filters.minScore) return false;
                    if (filters.maxScore !== null && t.value > filters.maxScore) return false;
                    return true;
                });
            }, [sortedTrials, filters]);

            // Live Trial Data
            const currentTrialId = useMemo(() => {
                const liveId = data.liveStatus?.trial_number;
                // Optuna trial numbers are 0-indexed, but our display IDs are 1-indexed (id = number + 1)
                if (liveId !== undefined && liveId !== null) return liveId + 1;
                
                if (sortedTrials.length > 0) {
                    const lastTrial = sortedTrials[sortedTrials.length - 1];
                    if (lastTrial.state === 'RUNNING' || lastTrial.state === 'WAITING') {
                        return lastTrial.id;
                    }
                    return lastTrial.id + 1;
                }
                return 1;
            }, [data.liveStatus, sortedTrials]);

            // --- IMPROVED PARAMS FALLBACK LOGIC ---
            const currentParams = useMemo(() => {
                const liveId = data.liveStatus?.trial_number;
                // 1. Try Live Params from Backend (only if it matches current trial)
                if (liveId !== undefined && (liveId + 1) === currentTrialId) {
                    const liveParams = data.liveStatus?.params;
                    if (liveParams && Object.keys(liveParams).length > 0) return liveParams;
                }
                
                // 2. Try Exact Match in History
                const historyTrial = trials.find(t => t.id === currentTrialId);
                if (historyTrial && historyTrial.params && Object.keys(historyTrial.params).length > 0) return historyTrial.params;
                
                // 3. AGGRESSIVE FALLBACK: If we are "running" but have no params, 
                // assume the latest trial in history is the one we want.
                if (trials.length > 0) {
                    const lastTrial = trials[trials.length - 1];
                    if (lastTrial.params && Object.keys(lastTrial.params).length > 0) return lastTrial.params;
                }
                
                return {};
            }, [data.liveStatus, trials, currentTrialId]);

            // Filter live data to only show if it matches current trial
            const liveTrialData = useMemo(() => {
                const liveId = data.liveStatus?.trial_number;
                if (liveId === undefined || (liveId + 1) !== currentTrialId) return [];
                if (!data.liveStatus || !data.liveStatus.epoch_history) return [];
                return data.liveStatus.epoch_history;
            }, [data.liveStatus, currentTrialId]);

            const learningCurveData = useMemo(() => {
                if (liveTrialData.length === 0) return [];
                return liveTrialData
                    .map((e) => ({
                        epoch: e.epoch,
                        train_loss: e.train_loss ?? e.loss ?? null,
                        val_loss: e.val_loss ?? e.validation_loss ?? e.valid_loss ?? e.nll ?? e["val_loss"] ?? null,
                    }))
                    .filter((e) => e.train_loss !== null || e.val_loss !== null);
            }, [liveTrialData]);

            // OLS Helper
            const calculateOLS = (points) => {
                const n = points.length;
                if (n < 2) return { slope: 0, intercept: 0 };
                
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                points.forEach(p => {
                    sumX += p.x;
                    sumY += p.value;
                    sumXY += p.x * p.value;
                    sumXX += p.x * p.x;
                });
                
                const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                return { slope, intercept };
            };

            // Chart Data (History & Forecast)
            const chartData = useMemo(() => {
                if (trials.length === 0) return [];
                
                // 1. Prepare Historical Data
                const history = trials.map((t, index, array) => {
                    const start = Math.max(0, index - 4);
                    const subset = array.slice(start, index + 1);
                    const avg = subset.reduce((a, b) => a + b.value, 0) / subset.length;
                    return { 
                        id: t.id,
                        x: index, // Use 0-based index for regression stability
                        value: t.value,
                        movingAverage: avg,
                        type: 'actual'
                    };
                }).sort((a,b) => a.id - b.id);

                // 2. Calculate OLS on Actual Data
                const { slope, intercept } = calculateOLS(history);

                // 3. Generate Projections (History + Future)
                const combinedData = history.map(p => ({
                    ...p,
                    linearFit: slope * p.x + intercept // Fit on history
                }));

                // Add 20 future points
                const lastIdx = history.length - 1;
                const lastId = history[lastIdx]?.id || 0;
                
                for (let i = 1; i <= 20; i++) {
                    const futureX = lastIdx + i;
                    const futureId = lastId + i;
                    combinedData.push({
                        id: futureId,
                        x: futureX,
                        value: null, // No actual value
                        movingAverage: null,
                        linearFit: slope * futureX + intercept, // Projected
                        type: 'projected'
                    });
                }

                return combinedData;
            }, [trials]);

            // Filter completed trials for analysis
            const completedTrials = useMemo(() => 
                trials.filter(t => t.state === 'COMPLETE' && t.value != null), 
                [trials]
            );

            // Auto-detect numeric params from completed trials
            const detectedParams = useMemo(() => {
                if (!completedTrials || completedTrials.length === 0) return { lr: null, embed: null };
                const paramCounts = {};
                completedTrials.forEach(t => {
                    Object.entries(t.params || {}).forEach(([key, val]) => {
                        if (typeof val === 'number') {
                            paramCounts[key] = (paramCounts[key] || 0) + 1;
                        }
                    });
                });
                // Sort by frequency, most common first
                const sortedParams = Object.entries(paramCounts).sort((a, b) => b[1] - a[1]).map(e => e[0]);
                // Find LR-like param (contains 'lr' or 'learning' or 'rate')
                const lrParam = sortedParams.find(p => /lr|learning|rate/i.test(p)) || sortedParams[0];
                // Find Embed-like param (contains 'emb' or 'dim' or 'hidden')
                const embedParam = sortedParams.find(p => /emb|dim|hidden/i.test(p) && p !== lrParam) || sortedParams[1];
                return { lr: lrParam, embed: embedParam };
            }, [completedTrials]);

            // Slice Data using auto-detected params from completed trials only
            const sliceDataLr = useMemo(() => 
                detectedParams.lr ? completedTrials
                    .map(t => ({ x: t.params?.[detectedParams.lr], y: t.value, id: t.id }))
                    .filter(d => d.x != null && d.y != null && !isNaN(d.x) && !isNaN(d.y)) : [], 
                [completedTrials, detectedParams.lr]
            );
            const sliceDataEmbed = useMemo(() => 
                detectedParams.embed ? completedTrials
                    .map(t => ({ x: t.params?.[detectedParams.embed], y: t.value, id: t.id }))
                    .filter(d => d.x != null && d.y != null && !isNaN(d.x) && !isNaN(d.y)) : [], 
                [completedTrials, detectedParams.embed]
            );

            // Styles
            const chartTheme = { text: colors.text, grid: colors.grid, tooltip: { backgroundColor: colors.tooltip, borderColor: colors.border, color: colors.textHigh } };

            const chartDefaults = {
                grid: { strokeDasharray: "3 3", stroke: colors.grid, vertical: false },
                xAxis: { stroke: colors.text, tick: {fontSize: 10}, tickLine: false, axisLine: false, dy: 10 },
                yAxis: { stroke: colors.text, tick: {fontSize: 10}, tickLine: false, axisLine: false, domain: ['auto', 'auto'] },
                tooltip: { 
                    contentStyle: { 
                        backgroundColor: colors.tooltip, 
                        borderColor: colors.border, 
                        borderRadius: "8px",
                        boxShadow: "0 10px 15px -3px rgba(0, 0, 0, 0.5)",
                        fontSize: '10px'
                    }, 
                    itemStyle: { fontSize: "12px", fontWeight: "bold" },
                    cursor: { stroke: colors.grid, strokeWidth: 1, strokeDasharray: '4 4' }
                }
            };

            const renderLegendWithHint = (value, hints = {}) => {
                const lowerKey = value.toLowerCase();
                const hint = hints[value] || (typeof metricHints !== 'undefined' ? metricHints[lowerKey] : null) || { tech: value, simple: "" };
                const lowerIsBetter = ['loss', 'val_loss', 'train_loss', 'duration', 'nll', 'brier', 'ece'].some(k => lowerKey.includes(k));
                return (
                    <RichTooltip 
                        trigger={value} 
                        title={value} 
                        tech={hint.tech}
                        simple={hint.simple}
                        direction={lowerIsBetter ? 'down' : 'up'}
                        width="w-48"
                        placement="bottom"
                        className="ml-2"
                    />
                );
            };

            // Helper for Epoch KPIs
            const getLastValidMetric = (data, key) => {
                if (!data || data.length === 0) return null;
                for (let i = data.length - 1; i >= 0; i--) {
                    if (data[i][key] !== undefined && data[i][key] !== null) {
                        return data[i][key];
                    }
                }
                return null;
            };

            const currentLoss = getLastValidMetric(liveTrialData, 'loss');
            const currentMrr = getLastValidMetric(liveTrialData, 'mrr');
            const currentMcc = getLastValidMetric(liveTrialData, 'mcc');
            const currentAuc = getLastValidMetric(liveTrialData, 'auc');

            // Study Projections (Global stats)
            const studyProjections = useMemo(() => {
                if (chartData.length < 2) return { predictedValue: 0, slope: 0, variance: 0 };
                
                // Extract slope from last two projected points (linear fit is consistent)
                const actuals = chartData.filter(d => d.type === 'actual');
                if (actuals.length < 2) return { predictedValue: 0, slope: 0, variance: 0 };

                // Recalculate slope/intercept from actuals only for stats
                const { slope, intercept } = calculateOLS(actuals);
                
                // Predicted value at trial 100 (or +20 from now)
                const targetX = actuals.length + 20;
                const predictedValue = slope * targetX + intercept;

                // Variance of actual residuals
                let sumSqRes = 0;
                actuals.forEach(d => {
                    sumSqRes += Math.pow(d.value - (slope * d.x + intercept), 2);
                });
                const variance = actuals.length > 0 ? sumSqRes / actuals.length : 0;

                return { predictedValue, slope, variance, intercept };
            }, [chartData]);

            // Estimated Completion
            const estimatedCompletion = useMemo(() => {
                const total = data.totalTrials || 100;
                const completed = trials.filter(t => t.state === 'COMPLETE');
                
                if (trials.length >= total) return "Concluído";
                if (!total) return "--h";

                let avgDuration = 0;
                if (completed.length > 0) {
                    const recent = completed.slice(-10);
                    const validDurations = recent.map(t => t.duration).filter(d => d > 1);
                    if (validDurations.length > 0) {
                        avgDuration = validDurations.reduce((a, b) => a + b, 0) / validDurations.length;
                    }
