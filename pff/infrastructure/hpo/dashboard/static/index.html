<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lira Hub v1.1 | Neuro-Symbolic HPO</title>
    
    <!-- 1. Tailwind (Dev Mode) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React Core (Load first) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Dependencies for Recharts (Strict Order) -->
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/classnames@2.3.2/index.min.js"></script>
    
    <!-- 4. Recharts (Stable UMD from JSDelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.min.js"></script>
    
    <!-- 5. Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js?v=20240115"></script>

    <!-- 6. Engineering Typography: JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- ZINC THEME (Technical Dark Palette) --- */
        :root {
            --zinc-950: #09090b;
            --zinc-900: #18181b;
            --zinc-800: #27272a;
            --zinc-700: #3f3f46;
            --zinc-600: #52525b;
            --zinc-500: #71717a;
            --zinc-400: #a1a1aa;
            --zinc-300: #d4d4d8;
            --zinc-200: #e4e4e7;
            --zinc-100: #f4f4f5;
            --indigo-500: #6366f1;
            --teal-400: #2dd4bf;
            --rose-500: #f43f5e;
        }

        /* Modern Scrollbar for Zinc Theme */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--zinc-950); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--zinc-800); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--zinc-700); }
        
        /* Animation utilities - BALANCED for scientific dashboard */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Orbit animations - slower and subtle */
        @keyframes orbit-cw {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes orbit-ccw {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes liquid-wave {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; box-shadow: 0 0 20px currentColor; }
            50% { opacity: 1; box-shadow: 0 0 40px currentColor; }
        }

        @keyframes pop-elastic {
            0% { transform: scale(0.95); opacity: 0; }
            70% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-spring-up { 
            animation: fadeUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; 
        }

        /* Re-enabled orbit animations with slower, more subtle timing */
        .animate-orbit-slow { 
            animation: orbit-cw 25s linear infinite; 
            will-change: transform;
        }
        .animate-orbit-fast-rev { 
            animation: orbit-ccw 15s linear infinite; 
            will-change: transform;
        }
        
        .ambient-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: float-gentle 8s ease-in-out infinite;
            will-change: transform;
        }

        .liquid-progress {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: liquid-wave 2s linear infinite;
        }

        .success-shockwave {
            position: absolute;
            border: 2px solid var(--teal-400);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .luminous-trail {
            stroke-dasharray: 10, 1000;
            animation: line-trail 25s linear infinite;
        }

        @keyframes line-trail {
            to { stroke-dashoffset: -1000; }
        }

        .elastic-tab-bg {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: left, width;
        }

        .tilt-card {
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.15s ease-out;
        }

        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: brightness(1); }
            50% { transform: scale(1.05); opacity: 1; filter: brightness(1.2); }
        }

        @keyframes flashSuccess {
            0% { background-color: rgba(45, 212, 191, 0); box-shadow: 0 0 0 rgba(45, 212, 191, 0); }
            50% { background-color: rgba(45, 212, 191, 0.2); box-shadow: 0 0 20px rgba(45, 212, 191, 0.2); }
            100% { background-color: rgba(45, 212, 191, 0); box-shadow: 0 0 0 rgba(45, 212, 191, 0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes meshMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-mesh {
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05), transparent 50%),
                        radial-gradient(circle at 10% 10%, rgba(45, 212, 191, 0.05), transparent 30%);
            background-size: 200% 200%;
            animation: meshMovement 20s ease infinite;
        }

        .animate-breath { animation: breath 4s ease-in-out infinite; }
        .animate-flash-success { animation: flashSuccess 0.8s ease-out forwards; }
        .animate-slide-left { animation: slideInLeft 0.35s ease-out forwards; }
        .animate-slide-right { animation: slideInRight 0.35s ease-out forwards; }
        
        .skeleton-shimmer {
            background: linear-gradient(90deg, var(--zinc-900) 25%, var(--zinc-800) 50%, var(--zinc-900) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        /* Accessiblity: Respect user preference for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-delay: -1ms !important;
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                background-attachment: initial !important;
                scroll-behavior: auto !important;
                transition-duration: 0s !important;
                transition-delay: 0s !important;
            }
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.4);
        }

        /* Typography utilities */
        .text-zinc-300 { color: var(--zinc-300); }
        .text-zinc-100 { color: var(--zinc-100); }
    </style>
</head>
    <body class="bg-zinc-950 text-zinc-300 selection:bg-indigo-500/30 selection:text-indigo-200 antialiased overflow-x-hidden">
        <div id="root" class="relative min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // --- HOOKS ---
        const usePrevious = (value) => {
            const ref = useRef();
            useEffect(() => {
                ref.current = value;
            }, [value]);
            return ref.current;
        };

        const useCountUp = (target, duration = 1000, decimals = 4) => {
            const [count, setCount] = useState(target);
            const prevTarget = usePrevious(target);

            useEffect(() => {
                if (prevTarget === undefined || prevTarget === target) return;
                
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const currentCount = progress * (target - prevTarget) + prevTarget;
                    setCount(currentCount);
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            }, [target, prevTarget, duration]);

            return typeof count === 'number' ? count.toFixed(decimals) : count;
        };
        
        // Robust Recharts import
        const RechartsLib = window.Recharts || window.recharts || {};
        
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, 
            BarChart, Bar, ScatterChart, Scatter, Legend, AreaChart, Area, ComposedChart, Cell
        } = RechartsLib;

        if (!window.Recharts && !window.recharts) {
            console.error("Critical: Recharts failed to load.");
        }

        // --- ICONS (Inline SVGs) ---
        const IconBase = ({ d, className = "", size = 16, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Activity = (p) => <IconBase {...p} d={<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>} />;
        const RefreshCw = (p) => <IconBase {...p} d={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>} />;
        const Zap = (p) => <IconBase {...p} d={<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>} />;
        const Clock = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />;
        const TrendingUp = (p) => <IconBase {...p} d={<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>} />;
        const Layers = (p) => <IconBase {...p} d={<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>} />;
        const TableIcon = (p) => <IconBase {...p} d={<path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>} />;
        const Cpu = (p) => <IconBase {...p} d={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></>} />;
        const Filter = (p) => <IconBase {...p} d={<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>} />;
        const Microscope = (p) => <IconBase {...p} d={<><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></>} />;
        const Share2 = (p) => <IconBase {...p} d={<><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></>} />;
        const AlertTriangle = (p) => <IconBase {...p} d={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
        const Search = (p) => <IconBase {...p} d={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />;
        const Sliders = (p) => <IconBase {...p} d={<><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></>} />;
        const BarChart2 = (p) => <IconBase {...p} d={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>} />;
        const GitMerge = (p) => <IconBase {...p} d={<><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></>} />;

        const Download = (p) => <IconBase {...p} d={<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>} />;
        const ArrowUp = (p) => <IconBase {...p} d={<><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></>} />;
        const ArrowDown = (p) => <IconBase {...p} d={<><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></>} />;
        const HelpCircle = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
        const FileText = (p) => <IconBase {...p} d={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></>} />;
        const ChevronRight = (p) => <IconBase {...p} d={<polyline points="9 18 15 12 9 6"/>} />;
        const TargetIcon = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />;
        const Info = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />;

        // --- COLORS (Tech-Surgical Palette) ---
        const colors = {
            bg: "#09090b", // Zinc 950
            card: "#18181b", // Zinc 900
            border: "#27272a", // Zinc 800
            text: "#a1a1aa", // Zinc 400
            textHigh: "#e4e4e7", // Zinc 200
            primary: "#6366f1", // Indigo 500
            success: "#2dd4bf", // Teal 400
            error: "#f43f5e", // Rose 500
            grid: "#27272a", // Zinc 800
            tooltip: "#09090b", // Zinc 950
        };

        // --- RECHARTS WRAPPERS (Standardized Styles) ---
        const ChartGrid = (props) => (
            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} vertical={false} {...props} />
        );

        const ChartXAxis = (props) => (
            <XAxis tick={{ fill: colors.text, fontSize: 10 }} tickLine={{ stroke: colors.border }} axisLine={{ stroke: colors.border }} {...props} />
        );

        const ChartYAxis = (props) => (
            <YAxis tick={{ fill: colors.text, fontSize: 10 }} tickLine={{ stroke: colors.border }} axisLine={{ stroke: colors.border }} {...props} />
        );

        const ChartTooltip = (props) => (
            <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: 11 }} labelStyle={{ color: colors.textHigh }} itemStyle={{ color: colors.text }} {...props} />
        );

        const ChartLegend = (props) => (
            <Legend wrapperStyle={{ fontSize: 10, color: colors.text }} {...props} />
        );

        // --- COMPONENTS ---

        // Generic Tooltip Component for Legends and Tables
        const RichTooltip = ({ trigger, title, tech, simple, direction = null, align = "center", width = "w-64", placement = "top", className = "" }) => {
            // direction: 'up' (higher is better), 'down' (lower is better), null (neutral)
            // align: 'center' (default), 'right', 'left'
            // placement: 'top' (tooltip above trigger), 'bottom' (tooltip below trigger)
            
            const positionClass = placement === 'bottom' ? 'top-full mt-2' : 'bottom-full mb-2';
            const arrowClass = placement === 'bottom' ? 'bottom-full -mb-1 border-b-zinc-800' : 'top-full -mt-1 border-t-zinc-800';
            
            let alignClass = 'left-1/2 -translate-x-1/2';
            if (align === 'right') alignClass = 'right-0';
            if (align === 'left') alignClass = 'left-0';

            let arrowAlignClass = 'left-1/2 -translate-x-1/2';
            if (align === 'right') arrowAlignClass = 'right-4';
            if (align === 'left') arrowAlignClass = 'left-4';

            return (
                <span className={`group relative cursor-help flex items-center gap-1 ${align === 'right' ? 'justify-end' : ''} ${className}`}>
                    {trigger}
                    {direction === 'down' && <ArrowDown size={10} className="text-rose-500" title="Quanto menor, melhor" />}
                    {direction === 'up' && <ArrowUp size={10} className="text-teal-500" title="Quanto maior, melhor" />}
                    
                    <div className={`absolute ${positionClass} ${width} bg-zinc-950 border border-zinc-800 p-3 rounded-lg shadow-2xl opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none z-[100] text-left whitespace-normal ${alignClass} scale-0 group-hover:scale-100 origin-bottom`}>
                        <div className="animate-[pop-elastic_0.4s_cubic-bezier(0.34,1.56,0.64,1)]">
                            <div className="text-[10px] font-bold text-zinc-200 mb-1 border-b border-zinc-800 pb-1 flex items-center gap-2">
                                <HelpCircle size={10} className="text-teal-500" />
                                <span>{title}</span>
                                {direction === 'down' && <span className="text-[8px] bg-teal-500/10 text-teal-400 px-1 rounded border border-teal-500/20 uppercase">Melhor se menor</span>}
                                {direction === 'up' && <span className="text-[8px] bg-teal-500/10 text-teal-400 px-1 rounded border border-teal-500/20 uppercase">Melhor se maior</span>}
                            </div>
                            {tech && <p className="text-[9px] text-zinc-400 font-sans mb-2 leading-relaxed">{tech}</p>}
                            {simple && <p className="text-[9px] text-teal-500/80 italic font-sans border-l-2 border-teal-500/20 pl-2">{simple}</p>}
                        </div>
                        
                        {/* Pointer Arrow */}
                        <div className={`absolute ${arrowClass} border-4 border-transparent ${arrowAlignClass}`}></div>
                    </div>
                </span>
            );
        };
        
        const HelpButton = ({ text, id }) => (
            <div className="group relative">
                <button 
                    type="button"
                    className="cursor-help text-zinc-600 hover:text-zinc-400 transition-colors p-0.5 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                    aria-label="Mostrar ajuda"
                    aria-describedby={id}
                >
                    <HelpCircle size={14} aria-hidden="true" />
                </button>
                <div 
                    id={id}
                    role="tooltip"
                    className="absolute right-0 top-full mt-2 w-64 bg-zinc-900 border border-zinc-700 p-3 rounded-lg shadow-xl opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none z-50 text-left scale-0 group-hover:scale-100 origin-top-right"
                >
                    <div>
                        <div className="text-[10px] font-bold text-zinc-300 mb-1 border-b border-zinc-800 pb-1 flex items-center gap-2">
                            <HelpCircle size={10} className="text-teal-500" aria-hidden="true" />
                            <span>Sobre este gráfico</span>
                        </div>
                        <p className="text-[9px] text-zinc-400 leading-relaxed">{text}</p>
                    </div>
                    <div className="absolute bottom-full right-1 -mb-1 border-4 border-transparent border-b-zinc-700" aria-hidden="true"></div>
                </div>
            </div>
        );

        // Global helper for legend hints (accessible to all chart components)
        const renderLegendWithHints = (value, hints = {}) => {
            const lowerKey = value.toLowerCase();
            const hint = hints[value] || { tech: value, simple: "" };
            const lowerIsBetter = ['loss', 'perda', 'val_loss', 'train_loss', 'duration', 'duração', 'nll', 'brier', 'ece', 'time', 'tempo'].some(k => lowerKey.includes(k));
            const isNeutral = ['norm', 'gradiente', 'parallel', 'outros', 'melhores'].some(k => lowerKey.includes(k));
            const direction = isNeutral ? null : (lowerIsBetter ? 'down' : 'up');
            return (
                <RichTooltip 
                    trigger={value} 
                    title={value} 
                    tech={hint.tech}
                    simple={hint.simple}
                    direction={direction}
                    width="w-56"
                    placement="bottom"
                    className="ml-2"
                />
            );
        };

        // --- EXPORT COMPONENT ---
        const ExportMenu = ({ data, projections, filename = "hpo_export", minimal = false }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            
            // Close on click outside

            // Detect if value is a string with units (like "5h 30m", "2.5 t/m", etc.)
            const isStringValue = typeof value === 'string' && (
                value.includes('h') || value.includes('m') || value.includes('t/m') || 
                value.includes('—') || value.includes('--') || value === 'Concluído'
            );
            
            const numericValue = isStringValue ? 0 : (typeof value === 'number' ? value : parseFloat(value) || 0);
            const animatedValue = useCountUp(numericValue, 1500, label.toLowerCase().includes('trial') ? 0 : 4);
            const displayValue = isStringValue ? value : animatedValue;

            useEffect(() => {
                if (prevValue !== undefined && prevValue !== value && !loading) {
                    setIsFlashing(true);
                    const timer = setTimeout(() => setIsFlashing(false), 1000);
                    return () => clearTimeout(timer);
                }
            }, [value, prevValue, loading]);

            const themes = {
                indigo: "from-indigo-500/10 to-indigo-600/5 border-indigo-500/20 text-indigo-400",
                teal:   "from-teal-500/10 to-teal-600/5 border-teal-500/20 text-teal-400",
                purple: "from-purple-500/10 to-purple-600/5 border-purple-500/20 text-purple-400",
                orange: "from-orange-500/10 to-orange-600/5 border-orange-500/20 text-orange-400",
                rose:   "from-rose-500/10 to-rose-600/5 border-rose-500/20 text-rose-400",
            };

            // Auto-detect direction based on label for accessibility
            const lowerLabel = label.toLowerCase();
            const autoDirection = direction || (
                ['loss', 'nll', 'brier', 'ece', 'duração', 'duration', 'tempo', 'time', 'latência', 'latency'].some(k => lowerLabel.includes(k)) ? 'down' :
                ['mrr', 'mcc', 'auc', 'hits', 'score', 'accuracy', 'precisão', 'precision', 'recall', 'f1'].some(k => lowerLabel.includes(k)) ? 'up' : null
            );

            const directionIndicator = autoDirection === 'up' ? '↑' : autoDirection === 'down' ? '↓' : '';
            const directionLabel = autoDirection === 'up' ? '(maior é melhor)' : autoDirection === 'down' ? '(menor é melhor)' : '';

            return (
                <div 
                    className={`relative p-4 rounded-xl border bg-gradient-to-br ${themes[color] || themes.indigo} overflow-hidden shadow-sm transition-all duration-300 hover:scale-[1.02] hover:shadow-md animate-spring-up ${isFlashing ? 'animate-flash-success' : ''}`}
                    style={{ animationDelay: `${delay}ms` }}
                    role="status"
                    aria-label={`${label}: ${displayValue} ${directionLabel}`}
                >
                <div className="flex justify-between items-start mb-1 z-10 relative">
                    <span className="text-[10px] font-bold uppercase tracking-widest opacity-60 text-zinc-400">
                        {label}
                        {directionIndicator && <span className="ml-1 opacity-80" aria-hidden="true">{directionIndicator}</span>}
                    </span>
                    {Icon && <Icon size={16} className="opacity-80" aria-hidden="true" />}
                </div>
                <div className="text-2xl font-bold font-mono tabular-nums tracking-tighter text-zinc-100 flex items-center gap-2">
                    {displayValue}
                    {loading && <span className="flex h-2 w-2 rounded-full bg-current animate-ping opacity-75" aria-label="Carregando"></span>}
                </div>
                {subtext && (
                    <div className="text-xs mt-1.5 flex items-center gap-1 opacity-50 font-medium text-zinc-400">
                    {subtext}
                    </div>
                )}
                </div>
            );
        };

        const CurrentTrialCard = ({ liveStatus, computedId }) => {
            // Local timer state for real-time updates
            const [localElapsed, setLocalElapsed] = useState(0);
            const lastUpdateRef = useRef(null);
            
            // Update local elapsed time every second
            useEffect(() => {
                if (!liveStatus?.updated_at) return;
                
                const baseElapsed = liveStatus.elapsed_seconds || liveStatus.elapsed || 0;
                const updateTime = new Date(liveStatus.updated_at).getTime();
                
                // Initialize
                lastUpdateRef.current = updateTime;
                setLocalElapsed(baseElapsed);
                
                const interval = setInterval(() => {
                    const now = Date.now();
                    const secondsSinceUpdate = (now - lastUpdateRef.current) / 1000;
                    setLocalElapsed(baseElapsed + secondsSinceUpdate);
                }, 1000);
                
                return () => clearInterval(interval);
            }, [liveStatus?.updated_at, liveStatus?.elapsed_seconds]);
            
            if (!liveStatus) return (
                <div className="relative p-4 rounded-xl border border-zinc-800 bg-zinc-900/50 text-zinc-500 overflow-hidden min-h-[100px] flex flex-col justify-center">
                    <div className="text-[10px] font-bold uppercase tracking-widest opacity-70 mb-1">TRIAL ATUAL</div>
                    <div className="text-xl font-bold font-mono">Aguardando...</div>
                </div>
            );

            const progress = liveStatus.progress || 0;
            const epoch = liveStatus.current_epoch || 0;
            const total = liveStatus.total_epochs || '?';
            const displayId = computedId !== undefined ? computedId : (liveStatus.trial_number + 1);
            const foldInfo = liveStatus.cv_fold_id !== undefined && liveStatus.cv_fold_id !== null ? `Fold ${liveStatus.cv_fold_id}` : null;
            
            // Time logic - using local elapsed for real-time updates
            const elapsed = localElapsed;
            const eta = progress > 0 && progress < 100 ? (elapsed / (progress / 100)) - elapsed : 0;
            
            const formatTime = (s) => {
                if (!s || s <= 0 || s === Infinity) return "--m --s";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}m ${sec}s`;
            };

            return (
                <article 
                    className="relative p-4 rounded-xl border bg-gradient-to-br from-indigo-500/10 to-indigo-600/5 border-indigo-500/20 text-indigo-400 overflow-hidden flex flex-col justify-between shadow-md min-h-[100px]"
                    role="status"
                    aria-label={`Trial atual: ${displayId} ${foldInfo ? `, ${foldInfo}` : ''}`}
                >
                    <div>
                        <div className="text-[10px] font-bold uppercase tracking-widest opacity-70 text-zinc-400 mb-1">TRIAL ATUAL</div>
                        <div className="flex items-baseline gap-2">
                            <span className="text-3xl font-bold font-mono tabular-nums text-white">#{displayId}</span>
                            <div className="flex flex-col">
                                <span className="text-sm font-medium text-teal-400 uppercase tracking-wider">Executando</span>
                                {foldInfo && <span className="text-[9px] font-bold text-indigo-400/80 uppercase tracking-tighter -mt-1">{foldInfo}</span>}
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-3">
                        <div className="h-2 w-full bg-zinc-800 rounded-full overflow-hidden relative border border-zinc-700/30">
                            <div 
                                className="h-full bg-indigo-500 transition-all duration-500 shadow-[0_0_10px_rgba(99,102,241,0.5)] relative" 
                                style={{width: `${progress}%`}}
                            >
                                <div className="absolute inset-0 liquid-progress opacity-30"></div>
                            </div>
                        </div>
                        <div className="flex justify-between items-end mt-1 text-[10px] font-mono tabular-nums text-zinc-400">
                            <div className="flex flex-col gap-0.5">
                                <span className="font-bold text-zinc-300">Época {epoch}/{total}</span>
                                <div className="flex gap-2 text-[9px] text-zinc-500 font-medium">
                                    <span>Decorrido: {formatTime(elapsed)}</span>
                                    <span className="text-teal-500/70 tracking-tighter">ETA: {formatTime(eta)}</span>
                                </div>
                            </div>
                            <span className="font-bold text-indigo-400 text-xs">{progress.toFixed(0)}%</span>
                        </div>
                    </div>
                </article>
            );
        };

        const BestTrialCard = ({ trial, delay = 0 }) => {
            const displayId = useCountUp(trial?.id || 0, 2000, 0);
            
            if (!trial || !trial.params) return (
                <div className="flex items-center justify-center h-full text-zinc-600 italic border border-zinc-800 rounded-xl bg-zinc-900/30 min-h-[250px] animate-spring-up" style={{ animationDelay: `${delay}ms` }}>
                    Nenhum melhor trial ainda
                </div>
            );

            return (
                <div 
                    className="relative p-6 rounded-xl border border-zinc-800 bg-zinc-900/40 overflow-hidden flex flex-col h-full shadow-lg transition-all duration-300 hover:scale-[1.01] hover:shadow-xl animate-spring-up"
                    style={{ animationDelay: `${delay}ms` }}
                >
                    {/* Header */}
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-2">
                            <Cpu className="text-teal-400" size={18} />
                            <h3 className="font-bold text-zinc-200 tracking-wide text-sm uppercase">PARÂMETROS DO MELHOR TRIAL</h3>
                        </div>
                        <HelpButton text="Lista os hiperparâmetros que geraram o melhor resultado até agora. | A receita do bolo. A melhor combinação de ingredientes descoberta até agora." />
                    </div>

                    {/* Orbital System */}
                    <div className="flex justify-center mb-8 relative">
                        <div className="relative w-32 h-32 flex items-center justify-center">
                            {/* Outer Ring */}
                            <div className="absolute inset-0 border border-teal-500/20 rounded-full animate-orbit-slow">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-teal-400 rounded-full shadow-[0_0_10px_rgba(45,212,191,0.8)]"></div>
                            </div>
                            {/* Inner Ring */}
                            <div className="absolute inset-4 border border-indigo-500/30 border-dashed rounded-full animate-orbit-fast-rev"></div>
                            
                            {/* Central Glow */}
                            <div className="absolute inset-8 bg-teal-500/5 blur-xl rounded-full animate-breath"></div>

                            {/* ID Circle */}
                            <div className="w-20 h-20 rounded-full border-2 border-teal-500/40 flex items-center justify-center relative bg-zinc-900/80 backdrop-blur-sm z-10">
                                <span className="text-4xl font-bold text-teal-400 font-mono tabular-nums tracking-tighter">{displayId}</span>
                                <div className="absolute -bottom-3 bg-teal-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-lg border border-teal-500/50 animate-breath">
                                    MELHOR
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Params List */}
                    <div className="space-y-4 flex-1 overflow-y-auto max-h-[300px] custom-scrollbar pr-2">
                        {Object.entries(trial.params).map(([key, val]) => (
                            <div key={key} className="flex justify-between items-center border-b border-zinc-800/60 pb-2 group hover:bg-zinc-800/30 rounded px-2 transition-colors">
                                <span className="text-zinc-500 text-xs font-medium capitalize tracking-wide">{key.replace(/_/g, ' ')}</span>
                                <span className="text-zinc-100 font-mono tabular-nums font-bold text-sm" title={formatParamValue(val)}>{formatParamValue(val)}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const RecentTrialsTable = ({ trials, bestValue }) => {
            return (
                <div className="w-full overflow-auto custom-scrollbar h-full">
                    <table className="w-full text-left border-collapse whitespace-nowrap">
                        <thead className="text-[10px] text-zinc-500 uppercase tracking-wider font-bold border-b border-zinc-800 sticky top-0 bg-[#09090b] z-10 shadow-sm">
                            <tr>
                                <th className="pb-4 pt-2 pl-4">Trial ID</th>
                                <th className="pb-4 pt-2">Status</th>
                                <th className="pb-4 pt-2 text-right text-teal-400">
                                    <RichTooltip 
                                        trigger="Score (Value)" 
                                        title="SCORE" 
                                        tech="Valor da função objetivo otimizada." 
                                        simple="A nota final do aluno nesta prova." 
                                        direction="up" 
                                        align="right" 
                                        placement="bottom"
                                    />
                                </th>
                                <th className="pb-4 pt-2 pl-6">Params Summary</th>
                                <th className="pb-4 pt-2 text-right">
                                    <RichTooltip 
                                        trigger="Duration" 
                                        title="DURATION" 
                                        tech="Tempo de execução em segundos." 
                                        simple="Quanto tempo demorou para treinar." 
                                        direction="down" 
                                        align="right" 
                                        placement="bottom"
                                    />
                                </th>
                                <th className="pb-4 pt-2 text-right pr-4">
                                    <RichTooltip 
                                        trigger="Efficiency" 
                                        title="EFFICIENCY" 
                                        tech="Score por segundo (x1000)." 
                                        simple="Velocidade de ganho de qualidade." 
                                        direction="up" 
                                        align="right" 
                                        placement="bottom"
                                    />
                                </th>
                            </tr>
                        </thead>
                        <tbody className="text-xs">
                            {trials.slice().reverse().map(t => {
                                const isBest = t.value === bestValue && t.value > 0;
                                const efficiency = t.duration > 0 ? (t.value / t.duration * 1000) : 0;
                                const paramsStr = Object.entries(t.params || {})
                                    .map(([k, v]) => `${k.slice(0,3)}=${formatParamValue(v)}`)
                                    .join(', ');

                                return (
                                    <tr key={t.id} className={`border-b border-zinc-800/40 hover:bg-zinc-800/40 transition-colors group ${isBest ? 'bg-teal-500/5 shadow-[inset_0_0_15px_rgba(45,212,191,0.1)]' : ''}`}>
                                        <td className="py-4 pl-4 flex items-center">
                                            <span className={`inline-flex items-center justify-center w-7 h-7 rounded font-bold font-mono tabular-nums text-[10px] ${isBest ? 'bg-teal-500/20 text-teal-400 border border-teal-500/30 animate-breath' : 'bg-zinc-800 text-zinc-400 border border-zinc-700'}`}>
                                                {t.id <= 3 ? '-' : (t.id - 3)}
                                            </span>
                                            {t.id <= 3 && (
                                                <span className="ml-2 inline-flex items-center justify-center h-5 px-1.5 rounded bg-amber-500/10 border border-amber-500/20 text-[9px] font-bold text-amber-500 tracking-wider" title="Warm-start trial">WARM</span>
                                            )}
                                        </td>
                                        <td className="py-4">
                                            <span className={`px-2 py-1 rounded text-[9px] font-bold border ${
                                                t.state === 'COMPLETE' ? 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400' : 
                                                t.state === 'FAIL' ? 'bg-rose-500/10 border-rose-500/20 text-rose-400' :
                                                'bg-zinc-800 border-zinc-700 text-zinc-400'
                                            }`}>
                                                {t.state}
                                            </span>
                                        </td>
                                        <td className="py-4">
                                            <div className="flex items-center justify-end gap-2 text-zinc-200">
                                                <span className={`font-mono tabular-nums font-bold text-sm ${isBest ? 'text-teal-400' : ''}`}>{t.value.toFixed(4)}</span>
                                                {isBest && <Zap size={12} className="text-yellow-400 fill-yellow-400" />}
                                            </div>
                                        </td>
                                        <td className="py-4 pl-6 text-zinc-500 font-mono text-[10px] max-w-[200px] truncate group-hover:text-zinc-300 transition-colors" title={paramsStr}>
                                            {paramsStr}
                                        </td>
                                        <td className="py-4 text-right text-zinc-400 font-mono tabular-nums">
                                            {t.duration ? t.duration.toFixed(1) : '-'}s
                                        </td>
                                        <td className="py-4 pr-4 text-right font-mono tabular-nums text-zinc-500">
                                            {efficiency.toFixed(4)}
                                        </td>
                                    </tr>
                                );
                            })}
                            {trials.length === 0 && <tr><td colSpan="6" className="py-12 text-center text-zinc-600 italic">No trials completed yet</td></tr>}
                        </tbody>
                    </table>
                </div>
            );
        };

        const ParetoFrontPlot = ({ trials }) => {
            const data = useMemo(() => {
                if (!trials || trials.length === 0) return [];
                return trials
                    .filter(t => t.state === 'COMPLETE' && t.value > 0)
                    .map(t => ({
                        id: t.id,
                        x: t.duration || 0,
                        y: t.value || 0,
                        params: t.params
                    }));
            }, [trials]);

            if (data.length === 0) return <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">Sem dados — aguardando trials completos</div>;

            return (
                <div className="absolute inset-0">
                    <ResponsiveContainer width="100%" height="100%">
                        <ScatterChart margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                            <XAxis 
                                type="number" 
                                dataKey="x" 
                                name="Duration" 
                                unit="s" 
                                stroke={colors.text}
                                tick={{ fill: colors.text, fontSize: 10 }}
                                tickLine={{ stroke: colors.border }}
                                axisLine={{ stroke: colors.border }}
                                label={{ value: 'Duração (s)', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                            />
                            <YAxis 
                                type="number" 
                                dataKey="y" 
                                name="MRR" 
                                stroke={colors.text}
                                tick={{ fill: colors.text, fontSize: 10 }}
                                tickLine={{ stroke: colors.border }}
                                axisLine={{ stroke: colors.border }}
                                label={{ value: 'MRR', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }}
                            />
                            <RechartsTooltip 
                                cursor={{ strokeDasharray: '3 3' }} 
                                content={({ active, payload }) => {
                                    if (active && payload && payload.length) {
                                        const d = payload[0].payload;
                                        return (
                                            <div className="bg-zinc-950 border border-zinc-800 p-2 rounded text-xs text-zinc-200 shadow-xl">
                                                <div className="font-bold mb-1 text-indigo-400">Trial {d.id <= 3 ? '-' : '#' + (d.id - 3)}</div>
                                                <div className="grid grid-cols-2 gap-x-3 gap-y-1">
                                                    <span className="text-zinc-400">MRR:</span> <span className="text-teal-400 font-mono">{d.y.toFixed(4)}</span>
                                                    <span className="text-zinc-400">Time:</span> <span className="text-indigo-400 font-mono">{d.x.toFixed(1)}s</span>
                                                </div>
                                            </div>
                                        );
                                    }
                                    return null;
                                }} 
                            />
                            <Legend 
                                verticalAlign="top"
                                align="center"
                                wrapperStyle={{ fontSize: 10, paddingBottom: 5 }} 
                                formatter={(val) => renderLegendWithHints(val, {
                                    "Trials": { tech: "Fronteira de Pareto: trade-off entre custo computacional e qualidade.", simple: "Cada ponto é um trial. Pontos no canto superior esquerdo são os melhores (rápidos E bons)." }
                                })}
                            />
                            <Scatter name="Trials" data={data} fill="#8884d8">
                                {data.map((entry, index) => (
                                    <Cell key={`cell-${index}`} fill={entry.y > 0.25 ? colors.success : colors.primary} />
                                ))}
                            </Scatter>
                        </ScatterChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const EDFPlot = ({ trials }) => {
            const data = useMemo(() => {
                if (!trials || trials.length === 0) return [];
                const values = trials
                    .filter(t => t.state === 'COMPLETE')
                    .map(t => t.value)
                    .sort((a, b) => a - b);
                
                return values.map((val, i) => ({
                    x: val,
                    y: (i + 1) / values.length
                }));
            }, [trials]);

            if (data.length < 2) return <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">Sem dados — precisa de mais trials para EDF</div>;

            return (
                <div className="absolute inset-0">
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={data} margin={{ top: 25, right: 15, bottom: 35, left: 50 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} />
                            <XAxis 
                                type="number" 
                                dataKey="x" 
                                domain={['auto', 'auto']} 
                                stroke={colors.text}
                                tick={{ fill: colors.text, fontSize: 10 }}
                                tickLine={{ stroke: colors.border }}
                                axisLine={{ stroke: colors.border }}
                                label={{ value: 'MRR', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                            />
                            <YAxis 
                                type="number" 
                                dataKey="y" 
                                domain={[0, 1]} 
                                stroke={colors.text}
                                tick={{ fill: colors.text, fontSize: 10 }}
                                tickLine={{ stroke: colors.border }}
                                axisLine={{ stroke: colors.border }}
                                label={{ value: 'CDF', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }}
                            />
                            <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: 11 }} />
                            <Legend 
                                verticalAlign="top"
                                align="center"
                                wrapperStyle={{ fontSize: 10, paddingBottom: 5 }} 
                                formatter={(val) => renderLegendWithHints(val, {
                                    "Prob. Cumulativa": { tech: "CDF Empírica (Função de Distribuição Cumulativa).", simple: "Mostra quantos % dos alunos tiraram até essa nota. Curvas mais à direita = turma melhor." }
                                })}
                            />
                            <Line type="stepAfter" dataKey="y" stroke={colors.success} strokeWidth={2} dot={false} name="Prob. Cumulativa" />
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const GeneralizationGapChart = ({ data }) => {
            if (!data || data.length === 0) return <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">Sem dados — aguardando épocas</div>;

            return (
                <div className="absolute inset-0">
                    <ResponsiveContainer width="100%" height="100%">
                        <AreaChart data={data} margin={{ top: 25, right: 15, bottom: 30, left: 40 }}>
                            <defs>
                                <linearGradient id="colorGap" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor={colors.error} stopOpacity={0.3}/>
                                    <stop offset="95%" stopColor={colors.error} stopOpacity={0}/>
                                </linearGradient>
                            </defs>
                            <ChartGrid vertical={false} />
                            <ChartXAxis dataKey="epoch" label={{ value: 'Época', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }} />
                            <ChartYAxis label={{ value: 'Loss', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10, dx: -5 }} />
                            <ChartTooltip />
                            <Legend 
                                verticalAlign="top" 
                                align="center"
                                wrapperStyle={{ fontSize: '10px', paddingBottom: 5 }}
                                formatter={(value) => {
                                    const hints = {
                                        "Val Loss": "Erro no conjunto de validação. Se subir enquanto o treino desce, é Overfitting.",
                                        "Train Loss": "Erro no conjunto de treino. Deve cair constantemente."
                                    };
                                    return (
                                        <RichTooltip 
                                            trigger={value}
                                            title={value}
                                            simple={hints[value]}
                                            direction="down"
                                            width="w-48"
                                            placement="bottom"
                                            className="ml-2"
                                        />
                                    );
                                }}
                            />
                            <Area type="monotone" dataKey="val_loss" stackId="1" stroke={colors.error} fill="transparent" name="Val Loss" strokeDasharray="3 3" />
                            <Area type="monotone" dataKey="train_loss" stackId="2" stroke={colors.primary} fill="url(#colorGap)" name="Train Loss" />
                        </AreaChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const ParamImportance = ({ importances }) => {
            const data = useMemo(() => {
                if (!importances || Object.keys(importances).length === 0) return [];
                return Object.entries(importances)
                    .map(([name, value]) => ({ name, value }))
                    .sort((a,b) => b.value - a.value);
            }, [importances]);

            if (data.length === 0) return (
                <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                    Sem dados — análise fANOVA precisa de &gt;3 trials
                </div>
            );

            return (
                <div className="absolute inset-0 p-4">
                    <div className="absolute top-2 right-2 text-[9px] bg-zinc-800 px-1.5 py-0.5 rounded border border-zinc-700 text-zinc-400 z-10">
                        Method: fANOVA
                    </div>

        const ParallelCoordinatesPlot = ({ trials }) => {

                trials.forEach(t => {
                    Object.entries(t.params || {}).forEach(([k, v]) => {

                    });
                });
                // Prioritize up to 4 params + value
                const keys = Array.from(numericKeys).slice(0, 4);
                
                // 2. Find Min/Max for Normalization
                const ranges = {};
                keys.forEach(k => { ranges[k] = { min: Infinity, max: -Infinity }; });
                ranges['value'] = { min: 0, max: 1 }; // Score is 0-1

                trials.forEach(t => {
                    keys.forEach(k => {
                        const val = t.params[k];
                        if (val !== undefined) {
                            ranges[k].min = Math.min(ranges[k].min, val);
                            ranges[k].max = Math.max(ranges[k].max, val);
                        }
                    });
                });

                // 3. Create Parallel Data Structure
                // Recharts requires: [{ name: 'LR', line1: 0.1, line2: 0.5 }, { name: 'Emb', line1: 0.8, line2: 0.2 }]
                // We pivot: Columns are Axes (Params), Rows are Trials (Lines)

                        // Normalize 0-1
                        const range = ranges[axis] || { min: 0, max: 1 };
                        let norm = 0;
                        if (range.max > range.min) {

        const CorrelationMatrix = ({ trials }) => {
            const params = useMemo(() => {
                if (!trials || trials.length === 0) return [];
                // Find parameters that vary and are numerical
                const allKeys = new Set();
                trials.forEach(t => Object.keys(t.params || {}).forEach(k => allKeys.add(k)));
                
                const numericalKeys = Array.from(allKeys).filter(k => {
                    const vals = trials.map(t => t.params[k]).filter(v => typeof v === 'number');
                    return vals.length > trials.length * 0.8 && new Set(vals).size > 1;
                });
                
                // Pick top 5 most frequent or important looking
                return [...numericalKeys.slice(0, 5), 'value'];
            }, [trials]);
            
            const correlations = useMemo(() => {
                if (!trials || trials.length < 2 || params.length < 2) return null;
                
                const matrix = {};
                params.forEach(p1 => {
                    matrix[p1] = {};
                    params.forEach(p2 => {
                        if (p1 === p2) {
                            matrix[p1][p2] = 1;
                        } else {
                            const v1 = trials.map(t => p1 === 'value' ? t.value : t.params[p1]);
                            const v2 = trials.map(t => p2 === 'value' ? t.value : t.params[p2]);
                            
                            // Basic Pearson Correlation
                            const n = v1.length;
                            let sum1 = 0, sum2 = 0, sum1Sq = 0, sum2Sq = 0, pSum = 0;
                            let count = 0;
                            for(let i=0; i<n; i++) {
                                if (typeof v1[i] === 'number' && typeof v2[i] === 'number') {
                                    sum1 += v1[i];
                                    sum2 += v2[i];
                                    sum1Sq += v1[i] * v1[i];
                                    sum2Sq += v2[i] * v2[i];
                                    pSum += v1[i] * v2[i];
                                    count++;
                                }
                            }
                            if (count < 2) {
                                matrix[p1][p2] = 0;
                            } else {
                                const num = pSum - (sum1 * sum2 / count);
                                const den = Math.sqrt((sum1Sq - sum1 * sum1 / count) * (sum2Sq - sum2 * sum2 / count));
                                matrix[p1][p2] = den === 0 ? 0 : num / den;
                            }
                        }
                    });
                });
                return matrix;
            }, [trials, params]);
            
            if (!trials || trials.length < 2 || !correlations) return (
                <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                    Need more data for parameter correlation

            );

            return (
                <div className="h-full flex flex-col items-center justify-center p-2 overflow-hidden">
                   <div className="w-full">
                       <div className="grid gap-1 text-[9px] font-mono text-zinc-400 mb-1" style={{ gridTemplateColumns: `repeat(${params.length + 1}, minmax(0, 1fr))` }}>
                         <div></div>
                         {params.map(p => <div key={p} className="text-center uppercase truncate" title={p}>{p.replace(/_dim|_size|learning_/, '').slice(0,4)}</div>)}
                       </div>
                       <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${params.length + 1}, minmax(0, 1fr))` }}>

                              {params.map((col) => {
                                const val = correlations[row][col];
                                const isDiag = row === col;
                                const opacity = Math.abs(val);
                                const color = val > 0 ? 'bg-teal-500' : 'bg-rose-500';
                                return (
                                  <div key={`${row}-${col}`} className={`rounded ${isDiag ? 'bg-zinc-800' : color} flex items-center justify-center aspect-square mx-auto w-full max-w-[40px]`} style={{ opacity: isDiag ? 1 : Math.max(0.1, opacity * 0.8) }}>
                                    <span className="text-[10px] font-bold text-white/90">{isDiag ? '-' : val.toFixed(1)}</span>
                                  </div>
                                )
                              })}
                            </React.Fragment>
                          ))}
                       </div>
                       <div className="mt-4 flex justify-center gap-4 text-[8px] uppercase tracking-widest text-zinc-500 font-bold">

                           <div className="flex items-center gap-1.5"><div className="w-2 h-2 rounded bg-zinc-800"></div> Neutral</div>
                           <div className="flex items-center gap-1.5"><div className="w-2 h-2 rounded bg-teal-500"></div> Positive</div>
                       </div>
                   </div>
                </div>
            );
        };


        const MetricsEvolutionChart = ({ trials }) => {
            const { data, keys } = useMemo(() => {
                if (!trials || trials.length === 0) return { data: [], keys: [] };
                
                const allKeys = new Set(['mrr', 'best_mrr', 'mcc', 'accuracy', 'f1', 'recall', 'precision', 'ap10', 'pr_auc', 'auc']);
                
                // No filtering of warm trials - show all for consistency
                const processed = trials.map((t, index) => {
                    const metrics = t.metrics || {};
                    // Auto-discover extra keys
                    Object.keys(metrics).forEach(k => {
                        if (['duration', 'epoch', 'timestamp', 'time_block', 'rank_block', 'clf_block', 'trial_seed', 'trial_index'].indexOf(k) === -1 && typeof metrics[k] === 'number') {
                            allKeys.add(k);
                        }
                    });
                    
                    // Fallback for root properties
                    const rootCandidates = [
                        'hits1', 'hits@1', 'hits3', 'hits@3', 'hits10', 'hits@10'
                    ];
                    
                    rootCandidates.forEach(k => {
                        if (t[k] !== undefined && typeof t[k] === 'number') {
                            allKeys.add(k);
                        }
                    });

                    // Smart value resolution
                    const resolve = (key, ...candidates) => {
                        for (const c of candidates) {
                            if (c !== undefined && c !== null) return c;
                        }
                        return 0;
                    };

                    const mrrVal = resolve(null, metrics.mrr, t.mrr, metrics.best_mrr, t.best_mrr);
                    const bestMrrVal = resolve(null, metrics.best_mrr, t.best_mrr, mrrVal);

                    return {
                        originalId: t.id,
                        ...metrics,
                        ...t, 
                        mrr: mrrVal,
                        best_mrr: bestMrrVal,
                        mcc: metrics.mcc || t.mcc || 0,
                        score: t.value || metrics.score || 0, // Ensure Score is populated
                    };
                }).sort((a,b) => a.id - b.id);

                return { 
                    data: processed, 
                    keys: Array.from(allKeys).sort() 
                };
            }, [trials]);

            // Deterministic color generation
            const getColor = (str) => {
                // Fixed colors for known primaries
                if (str === 'mrr' || str === 'best_mrr') return colors.success; // Green/Teal
                if (str === 'mcc') return colors.error; // Red/Rose
                if (str === 'score') return colors.primary; // Indigo

                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash % 360);
                return `hsl(${hue}, 70%, 60%)`;
            };

            const isPrimary = (key) => ['mrr', 'best_mrr', 'mcc', 'score'].includes(key);

            const hasNegativeMcc = data.some(d => (d.mcc !== undefined && d.mcc < 0));
            const yDomain = hasNegativeMcc ? [-1, 1] : [0, 1];

            if (data.length === 0) return <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">Sem dados — aguardando trials</div>;

            // Define metadata for tooltip hints (MOVED TO GLOBAL SCOPE ABOVE)
            // const metricHints = { ... } 


            const renderLegendText = (value, entry) => {
                const lowerKey = value.toLowerCase();
                const hint = metricHints[lowerKey] || { tech: value, simple: "" };
                
                // Identify metrics where lower is better
                const lowerIsBetter = ['nll', 'brier', 'ece', 'loss', 'val_loss', 'train_loss'].includes(lowerKey);

                return (
                    <RichTooltip 
                        trigger={value.toUpperCase()}

                        width="w-64"

            return (

                            <XAxis dataKey="id" stroke={colors.text} tick={{fontSize: 10}} label={{ value: 'Trial ID', position: 'insideBottom', offset: -15, fill: colors.text, fontSize: 9 }} />
                            <YAxis stroke={colors.text} tick={{fontSize: 10}} domain={yDomain} />
                            <RechartsTooltip contentStyle={{ backgroundColor: colors.tooltip, borderColor: colors.border, fontSize: '10px' }} />
                            <Legend 
                                wrapperStyle={{ fontSize: '10px', paddingTop: '10px', paddingBottom: '10px', width: '100%', left: 0 }} 
                                verticalAlign="top" 
                                align="center"
                                height={80}
                                iconSize={8}
                                formatter={renderLegendText}
                            />
                            {keys.map(k => {
                                const isScore = k === 'score';
                                const isMcc = k === 'mcc';
                                const isPrimary = isScore || isMcc;
                                
                                return (
                                    <Line 
                                        key={k} 
                                        type="monotone" 
                                        dataKey={k} 
                                        stroke={isScore ? '#3b82f6' : getColor(k)} 
                                        strokeWidth={isScore ? 4 : (isPrimary ? 3 : 1)} 
                                        strokeOpacity={isPrimary ? 1 : 0.6}
                                        strokeDasharray={isPrimary ? "" : "3 3"}
                                        dot={false} 
                                        connectNulls
                                        name={k.toUpperCase()}
                                    />
                                );
                            })}
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        // === NEW COMPONENTS (Paper Compliance) ===

        // Contour Plot - Paper Section 5.1
        const ContourPlot = ({ trials }) => {
            const { params, gridData, extent } = useMemo(() => {
                if (!trials || trials.length < 5) return { params: [], gridData: [], extent: { minX: 0, maxX: 1, minY: 0, maxY: 1 } };
                
                const completed = trials.filter(t => t.state === 'COMPLETE' && t.value != null);
                if (completed.length < 5) return { params: [], gridData: [], extent: { minX: 0, maxX: 1, minY: 0, maxY: 1 } };
                
                // Find numeric params
                const paramCounts = {};
                completed.forEach(t => {
                    Object.entries(t.params || {}).forEach(([key, val]) => {
                        if (typeof val === 'number') {
                            paramCounts[key] = (paramCounts[key] || 0) + 1;
                        }
                    });
                });
                
                const sortedParams = Object.entries(paramCounts)
                    .filter(([_, count]) => count >= 3)
                    .sort((a, b) => b[1] - a[1])
                    .map(e => e[0]);
                
                if (sortedParams.length < 2) return { params: [], gridData: [], extent: { minX: 0, maxX: 1, minY: 0, maxY: 1 } };
                
                const paramX = sortedParams[0];
                const paramY = sortedParams[1];
                
                // Get data points
                const points = completed
                    .map(t => ({ x: t.params?.[paramX], y: t.params?.[paramY], z: t.value }))
                    .filter(p => p.x != null && p.y != null && p.z != null);
                
                if (points.length < 3) return { params: [paramX, paramY], gridData: [], extent: { minX: 0, maxX: 1, minY: 0, maxY: 1 } };
                
                // Calculate extent
                const minX = Math.min(...points.map(p => p.x));
                const maxX = Math.max(...points.map(p => p.x));
                const minY = Math.min(...points.map(p => p.y));
                const maxY = Math.max(...points.map(p => p.y));
                const minZ = Math.min(...points.map(p => p.z));
                const maxZ = Math.max(...points.map(p => p.z));
                
                // Create grid for heatmap (10x10)
                const gridSize = 10;
                const grid = [];
                
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        const cellX = minX + (maxX - minX) * (i + 0.5) / gridSize;
                        const cellY = minY + (maxY - minY) * (j + 0.5) / gridSize;
                        
                        // Inverse distance weighted interpolation
                        let sumWeights = 0;
                        let sumValues = 0;
                        
                        points.forEach(p => {
                            const dx = p.x - cellX;
                            const dy = p.y - cellY;
                            const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
                            const weight = 1 / (dist * dist);
                            sumWeights += weight;
                            sumValues += weight * p.z;
                        });
                        
                        const interpValue = sumWeights > 0 ? sumValues / sumWeights : 0;
                        const normalized = maxZ > minZ ? (interpValue - minZ) / (maxZ - minZ) : 0.5;
                        
                        grid.push({
                            x: i,
                            y: j,
                            xVal: cellX.toFixed(4),
                            yVal: cellY.toFixed(4),
                            value: interpValue,
                            normalized: normalized
                        });
                    }
                }
                
                return { 
                    params: [paramX, paramY], 
                    gridData: grid,
                    extent: { minX, maxX, minY, maxY, minZ, maxZ }
                };
            }, [trials]);
            
            if (gridData.length === 0) {
                return (
                    <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                        Dados insuficientes para contour plot (min. 5 trials com 2+ parâmetros numéricos)
                    </div>
                );
            }
            
            const getColor = (normalized) => {
                // Blue (low) -> Green (mid) -> Yellow -> Red (high)
                if (normalized < 0.25) return `rgb(59, 130, 246)`;
                if (normalized < 0.5) return `rgb(34, 197, 94)`;
                if (normalized < 0.75) return `rgb(234, 179, 8)`;
                return `rgb(239, 68, 68)`;
            };
            
            return (
                <div className="h-full flex flex-col">
                    <div className="text-[10px] text-zinc-400 mb-2 px-2">
                        X: <span className="text-indigo-400 font-mono">{params[0]}</span> | Y: <span className="text-teal-400 font-mono">{params[1]}</span>
                    </div>
                    <div className="flex-1 relative p-2">
                        <div className="grid gap-0.5" style={{ gridTemplateColumns: 'repeat(10, 1fr)', gridTemplateRows: 'repeat(10, 1fr)', height: '100%' }}>
                            {gridData.map((cell, idx) => (
                                <div 
                                    key={idx}
                                    className="relative group cursor-crosshair transition-transform hover:scale-110 hover:z-10"
                                    style={{ 
                                        backgroundColor: getColor(cell.normalized),
                                        opacity: 0.7 + cell.normalized * 0.3
                                    }}
                                    title={`${params[0]}=${cell.xVal}, ${params[1]}=${cell.yVal}, Score=${cell.value.toFixed(4)}`}
                                >
                                    <div className="absolute hidden group-hover:block bg-zinc-900 border border-zinc-700 rounded p-1 text-[9px] z-20 -top-12 left-1/2 -translate-x-1/2 whitespace-nowrap">
                                        Score: {cell.value.toFixed(4)}
                                    </div>
                                </div>
                            ))}
                        </div>
                        {/* Legend */}
                        <div className="absolute bottom-0 right-0 flex items-center gap-1 text-[9px] text-zinc-500">
                            <span>Low</span>
                            <div className="w-20 h-2 rounded" style={{ background: 'linear-gradient(to right, rgb(59,130,246), rgb(34,197,94), rgb(234,179,8), rgb(239,68,68))' }}></div>
                            <span>High</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Timeline Plot - Paper Section 6
        const TimelinePlot = ({ trials }) => {
            const data = useMemo(() => {
                if (!trials || trials.length === 0) return [];
                
                return trials
                    .filter(t => t.duration > 0)
                    .map((t, idx) => ({
                        id: t.id,
                        duration: t.duration,
                        value: t.value || 0,
                        state: t.state,
                        startOffset: idx * (t.duration || 60) * 0.1, // Simulated start offset
                    }))
                    .slice(-30); // Last 30 trials
            }, [trials]);
            
            if (data.length === 0) {
                return (
                    <div className="h-full flex items-center justify-center text-zinc-500 text-xs italic">
                        Sem dados de duração — aguardando trials
                    </div>
                );
            }
            
            return (
                <div className="absolute inset-0">
                    <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={data} layout="vertical" margin={{ top: 20, right: 30, bottom: 30, left: 50 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke={colors.grid} horizontal={true} vertical={false} />
                            <XAxis 
                                type="number" 
                                stroke={colors.text} 
                                tick={{ fontSize: 10 }}
                                label={{ value: 'Duração (s)', position: 'insideBottom', offset: -5, fill: colors.text, fontSize: 10 }}
                            />
                            <YAxis 
                                type="category" 
                                dataKey="id" 
                                stroke={colors.text} 
                                tick={{ fontSize: 9 }}
                                label={{ value: 'Trial', angle: -90, position: 'insideLeft', fill: colors.text, fontSize: 10 }}
                            />
                            <RechartsTooltip 
                                contentStyle={{ backgroundColor: colors.tooltip, borderColor: colors.border, fontSize: 10 }}
                                formatter={(value, name) => [value.toFixed(1) + 's', 'Duração']}
                            />
                            <Bar

                            >
                                {data.map((entry, index) => (
                                    <Cell 
                                        key={`cell-${index}`}
