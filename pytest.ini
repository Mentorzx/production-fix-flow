[pytest]
# Pytest configuration for PFF project

cache_dir = outputs/.cache/pytest

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = src

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --color=yes

# Markers (defined in tests/conftest.py as well)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    slow: Slow tests (>1s execution time)
    asyncio: Async tests using asyncio
    deprecated: Deprecated tests kept for compatibility

# Coverage options (if using pytest-cov)
# Uncomment when ready to add coverage reporting:
# --cov=pff --cov-report=html --cov-report=term

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Warning filters — ONLY third-party internal issues we cannot fix at source.
# Before adding a filter, verify the warning originates inside the library, NOT from our call-site.
# Filters removed after root-cause fix: HTTP_422 (Starlette), penalty=None (sklearn), fast_mcc_sweep (Numba).
filterwarnings =
    # [sklearn internal] L-BFGS-B optimizer uses deprecated disp/iprint — upstream issue
    # https://github.com/scikit-learn/scikit-learn/issues/29350
    ignore:.*disp.*iprint.*L-BFGS-B.*:DeprecationWarning
    # [Ray internal] unclosed file handles to /dev/null in ray._private.node
    ignore::ResourceWarning:ray._private.node
    # [aiobreaker internal] library calls datetime.utcnow() — v1.2.0, no fix released
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning:aiobreaker
    # [joblib internal] serial fallback when shared memory is unavailable in sandbox
    ignore:.*joblib will operate in serial mode.*:UserWarning:joblib._multiprocessing_helpers
    # [PyTorch internal] CUDA init probe warnings in CPU-only environments
    ignore:CUDA initialization.*cudaGetDeviceCount.*:UserWarning:torch.autograd.graph
    # [Numba internal] histogram-style prange accumulation with data-dependent indices
    # cannot always be auto-parallelized — expected behavior for ECE kernels
    ignore::numba.core.errors.NumbaPerformanceWarning
    # [Optuna internal] multivariate/group/constant_liar still experimental in v4.7.0
    ignore:Argument ``constant_liar`` is an experimental feature.*:optuna.exceptions.ExperimentalWarning
    ignore:Argument ``multivariate`` is an experimental feature.*:optuna.exceptions.ExperimentalWarning
    ignore:Argument ``group`` is an experimental feature.*:optuna.exceptions.ExperimentalWarning
    # [Ray internal] FutureWarning about GPU env var override
    ignore:.*Ray will no longer override accelerator visible devices.*:FutureWarning
    # [LanceDB internal] lance shared-memory fork-safety warning
    ignore:.*lance is not fork-safe.*:UserWarning:lancedb

# Logging
log_cli = false
log_cli_level = INFO

# Minimum Python version
minversion = 3.12
