[pytest]
# Pytest configuration for PFF project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --color=yes

# Markers (defined in tests/conftest.py as well)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    slow: Slow tests (>1s execution time)
    asyncio: Async tests using asyncio

# Coverage options (if using pytest-cov)
# Uncomment when ready to add coverage reporting:
# --cov=pff --cov-report=html --cov-report=term

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Warning filters - suppress only third-party library warnings we cannot fix
# These are bugs/deprecations in external libraries, not our code
filterwarnings =
    # scipy/sklearn L-BFGS-B deprecation - internal sklearn issue
    # https://github.com/scikit-learn/scikit-learn/issues/29350
    ignore:.*disp.*iprint.*L-BFGS-B.*:DeprecationWarning
    # Ray unclosed file handles - internal Ray issue
    # https://github.com/ray-project/ray/issues
    ignore::ResourceWarning:ray._private.node
    # aiobreaker datetime.utcnow() deprecation - library not updated yet
    # https://github.com/arlyon/aiobreaker/issues
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning:aiobreaker
    # joblib falls back to serial mode when shared memory is unavailable in sandbox
    ignore:.*joblib will operate in serial mode.*:UserWarning:joblib._multiprocessing_helpers

# Logging
log_cli = false
log_cli_level = INFO

# Minimum Python version
minversion = 3.12
